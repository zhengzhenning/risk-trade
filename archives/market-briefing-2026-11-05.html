<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A股题材发酵看板 · 2026-11-05</title>
<style>
  :root {
    --bg:#F8FAFC; --surface:#ffffff; --surface2:#F1F5F9; --surface3:#E2E8F0;
    --border:#E2E8F0; --border2:#CBD5E1;
    --txt:#0F172A; --sub:#64748B; --faint:#94A3B8;
    --accent:#b8860b; --red:#d63450; --red-bg:rgba(214,52,80,.09);
    --green:#0e9668; --green-bg:rgba(14,150,104,.09);
    --radius:8px;
    --shadow:0 1px 2px rgba(15,23,42,.05);
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  html { scroll-behavior:smooth; scroll-padding-top:64px; }
  body { background:var(--bg); color:var(--txt); font-family:"Inter","SF Pro Display",-apple-system,"PingFang SC","Segoe UI",Roboto,sans-serif; font-size:14px; line-height:1.5; -webkit-font-smoothing:antialiased; }
  .num { font-variant-numeric:tabular-nums; font-feature-settings:"tnum"; }
  .up { color:var(--red); } .down { color:var(--green); }

  nav { position:sticky; top:0; z-index:100; background:rgba(255,255,255,.92); backdrop-filter:blur(12px); border-bottom:1px solid var(--border); }
  .nav-inner { max-width:1440px; margin:0 auto; display:flex; align-items:center; gap:16px; padding:0 32px; height:52px; }
  .nav-logo { font-size:15px; font-weight:700; white-space:nowrap; }
  .nav-logo em { color:var(--accent); font-style:normal; }
  .nav-chips { display:flex; gap:6px; overflow-x:auto; scrollbar-width:none; margin-left:auto; }
  .nav-chips::-webkit-scrollbar { display:none; }
  .nav-chips a { flex:none; font-size:12px; color:var(--sub); text-decoration:none; padding:5px 11px; border-radius:999px; border:1px solid var(--border); transition:.15s; }
  .nav-chips a:hover { color:var(--txt); border-color:var(--border2); background:var(--surface2); }
  .nav-date { font-size:12px; color:var(--faint); white-space:nowrap; margin-left:8px; }
  @media (max-width:700px){
    .nav-date { display:none; }               /* 快照时间已在 hero 徽章呈现，窄屏让位给导航锚点 */
    .nav-inner { padding:0 16px; }
    .wrap { padding:20px 16px 60px; }
  }

  .wrap { max-width:1440px; margin:0 auto; padding:32px 32px 80px; }

  .hero { display:flex; align-items:flex-end; justify-content:space-between; flex-wrap:wrap; gap:16px; margin-bottom:28px; }
  .hero h1 { font-size:26px; font-weight:700; }
  .hero h1 span { color:var(--accent); font-weight:500; }
  .hero .sub { color:var(--sub); font-size:13px; margin-top:6px; }
  .badges { display:flex; gap:8px; flex-wrap:wrap; }
  .badge { font-size:12px; color:var(--sub); background:var(--surface); border:1px solid var(--border); border-radius:999px; padding:4px 12px; }
  .badge b { color:var(--txt); font-weight:600; }
  .badge.live { border-color:rgba(232,182,76,.4); color:var(--accent); }
  .badge.live b { color:var(--accent); }

  /* ---------- 大盘总览条 v3：上证/科创50 日K+成交额 ｜ 全市场成交量趋势（三档） ｜ 60日涨跌热力表 ---------- */
  .mkt-strip { display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-bottom:36px; }
  @media (max-width:980px){ .mkt-strip { grid-template-columns:1fr; } }
  .mkt-card { position:relative; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow); padding:14px 18px 12px; overflow:hidden; }
  .mkt-card::before { content:""; position:absolute; top:0; left:0; right:0; height:2px; background:linear-gradient(90deg,var(--ic,#3b66d4),transparent 60%); opacity:.75; }
  .mkt-heat { grid-column:1 / -1; }
  .mk-head { display:flex; align-items:baseline; gap:8px; flex-wrap:wrap; }
  .mk-name { font-size:13px; font-weight:700; }
  .mk-name i { font-style:normal; display:inline-block; width:8px; height:8px; border-radius:3px; background:var(--ic); margin-right:6px; transform:rotate(45deg); }
  .mk-en { font-size:10px; color:var(--faint); letter-spacing:1px; }
  .mk-asof { margin-left:auto; font-size:10.5px; color:var(--faint); }
  .mk-body { display:grid; grid-template-columns:158px 1fr; gap:16px; align-items:stretch; margin-top:6px; }
  .mk-numcol { display:flex; flex-direction:column; justify-content:space-between; padding:2px 0; min-width:0; }
  .mk-close { font-size:25px; font-weight:700; letter-spacing:.3px; line-height:1.15; }
  .mk-chg { font-size:13.5px; font-weight:700; margin-top:1px; }
  .mk-chg small { font-weight:600; margin-left:6px; }
  .mk-meta { display:flex; flex-direction:column; gap:3px; margin-top:8px; font-size:11px; color:var(--sub); }
  .mk-meta b { color:var(--txt); font-weight:600; }
  .mk-k { width:100%; height:auto; display:block; }
  .mk-chips { display:flex; flex-wrap:wrap; gap:6px 8px; margin:2px 0 6px; }
  .mk-chip { font-size:11px; color:var(--sub); border:1px solid var(--border); border-radius:999px; padding:2px 10px; background:var(--surface); white-space:nowrap; }
  .mk-chip b { color:var(--txt); font-weight:700; }
  .mk-chip.hot { border-color:rgba(214,52,80,.4); color:var(--red); }
  .mk-chip.hot b { color:var(--red); }
  .mk-chip.cold { border-color:rgba(14,150,104,.4); color:var(--green); }
  .mk-chip.cold b { color:var(--green); }
  .mk-chip.gold { border-color:rgba(184,134,11,.4); color:var(--accent); }
  .mk-chip.gold b { color:var(--accent); }
  .mk-axis { font-size:10px; fill:var(--faint); }
  .mk-note { font-size:10.5px; color:var(--faint); margin-top:4px; }
  .mh-band { margin-top:10px; }
  .mh-range { font-size:10.5px; color:var(--faint); margin:0 0 4px 122px; }
  .mh-grid { display:grid; grid-template-columns:112px repeat(30, 1fr); gap:3px 3px; align-items:stretch; min-width:max-content; }
  .mh-lab { font-size:11px; font-weight:600; color:var(--sub); display:flex; align-items:center; gap:6px; padding-right:8px; }
  .mh-lab i { font-style:normal; width:8px; height:8px; border-radius:3px; flex:none; }
  .mh-cell { font-size:10px; text-align:center; border-radius:4px; padding:4px 0; line-height:1.3; white-space:nowrap; }
  .mh-cell.mh-today { outline:1.5px solid rgba(184,134,11,.8); outline-offset:0; font-weight:700; }
  .mh-cell.mh-newmonth { margin-left:5px; }
  .mh-vcell { position:relative; height:96px; display:flex; align-items:flex-end; justify-content:center; border-bottom:1px solid #cfd8e5; background-image:repeating-linear-gradient(to right, #c3cedd 0 4px, transparent 4px 9px), repeating-linear-gradient(to right, #98a2b3 0 4px, transparent 4px 9px); background-size:100% 1px, 100% 1px; background-position:left calc(100% - 60px), left calc(100% - 90px); background-repeat:no-repeat, no-repeat; }
  .mh-vcell i { display:flex; align-items:flex-start; justify-content:center; width:74%; border-radius:2px 2px 0 0; min-height:3px; font-style:normal; font-size:9px; font-weight:700; color:#fff; padding-top:2px; line-height:1.2; }
  .mh-vcell.mh-vtoday { outline:1.5px solid rgba(184,134,11,.85); outline-offset:-1px; }
  .mh-vcell.mh-newmonth { margin-left:5px; }
  .mh-dh { display:flex; flex-direction:column; align-items:center; line-height:1.3; padding-bottom:1px; white-space:nowrap; }
  .mh-dh b { font-size:9.5px; font-weight:600; color:var(--sub); }
  .mh-dh span { font-size:8px; color:var(--faint); }
  .mh-dh.mh-today b, .mh-dh.mh-today span { color:var(--accent); font-weight:700; }
  .mh-legend { display:flex; flex-wrap:wrap; gap:4px 10px; font-size:10.5px; color:var(--sub); margin-top:8px; align-items:center; }
  .mh-legend i { font-style:normal; display:inline-block; width:10px; height:10px; border-radius:3px; margin-right:4px; vertical-align:-1px; }

  /* ---------- 题材区块 ---------- */
  .theme-block { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow); margin-bottom:22px; overflow:hidden; }
  .tb-head { display:flex; align-items:center; gap:14px; padding:18px 22px 14px; border-bottom:1px solid var(--border); position:relative; flex-wrap:wrap; }
  .tb-head::before { content:""; position:absolute; top:0; left:0; bottom:0; width:3px; background:var(--tc); }
  .tb-dot { width:12px; height:12px; border-radius:4px; background:var(--tc); transform:rotate(45deg); flex:none; }
  .tb-name { font-size:19px; font-weight:700; }
  .tb-span { font-size:12px; color:var(--sub); }
  .st { display:inline-block; font-size:11px; font-weight:600; border-radius:6px; padding:3px 10px; }
  .st-hot { color:var(--red); background:var(--red-bg); }
  .st-mid { color:var(--accent); background:rgba(232,182,76,.12); }
  .st-cool { color:var(--green); background:var(--green-bg); }
  .st-risk { color:#d63450; background:rgba(214,52,80,.08); border:1px solid rgba(214,52,80,.35); }


  .tb-body { display:grid; grid-template-columns:400px 1fr; border-top:1px solid var(--border); }
  @media (max-width:1100px){ .tb-body { grid-template-columns:1fr; } }
  .tb-stocks { padding:14px 18px; border-right:1px solid var(--border); }
  @media (max-width:1100px){ .tb-stocks { border-right:none; border-bottom:1px solid var(--border); } }
  .tb-stocks h4, .tb-news h4 { font-size:11px; font-weight:600; color:var(--faint); letter-spacing:1.5px; margin-bottom:10px; }
  .s-row { display:grid; grid-template-columns:minmax(104px,auto) 1fr; align-items:center; gap:12px; padding:7px 10px; border-radius:10px; cursor:pointer; transition:background .12s; }
  .s-row:hover { background:var(--surface2); }
  .s-row.active { background:var(--surface3); outline:1px solid var(--tc); }
  .s-id .nm { font-weight:600; font-size:13.5px; white-space:nowrap; }
  .s-id .nm a, .lad-cell a { color:inherit; text-decoration:none; }
  .s-id .nm a:hover, .lad-cell a:hover { color:#3b66d4; text-decoration:underline; }
  .s-id .cd { font-size:10.5px; color:var(--faint); }
  .pool { font-size:9.5px; border-radius:4px; padding:0 4px; margin-right:5px; vertical-align:1px; }
  .pool-lb { color:#ff9f43; border:1px solid rgba(255,159,67,.45); }
  .pool-m9 { color:#7aa2f7; border:1px solid rgba(122,162,247,.45); }
  .risk-chip { display:inline-block; font-size:9.5px; font-weight:600; color:#d63450; border:1px solid rgba(214,52,80,.4); background:rgba(214,52,80,.06); border-radius:4px; padding:0 4px; margin-left:5px; vertical-align:1px; cursor:help; }
  .pool-mo { color:#7aa2f7; border:1px solid rgba(122,162,247,.45); }
  .pool-out { color:var(--sub); border:1px dashed var(--border2); cursor:help; }
  .pool-d10 { color:#ff9f43; border:1px solid rgba(255,159,67,.45); }
  .top-chip { display:inline-block; font-size:9.5px; font-weight:700; color:var(--accent); border:1px solid rgba(184,134,11,.45); background:rgba(184,134,11,.08); border-radius:4px; padding:0 4px; margin-left:5px; vertical-align:1px; cursor:help; }
  .rk-chip { display:inline-block; font-style:normal; font-size:9.5px; font-weight:700; border:1px solid; border-radius:4px; padding:0 4px; margin-left:5px; vertical-align:1px; cursor:help; }
  .jjv { font-weight:700; text-decoration:underline dotted rgba(184,134,11,.6); text-underline-offset:3px; }
  .jj-tag { font-style:normal; font-size:9px; color:var(--accent); border:1px solid rgba(184,134,11,.4); border-radius:4px; padding:0 3px; margin-left:3px; vertical-align:1px; }
  /* 月度前七全景矩阵 */
  .mx-block { margin-bottom:26px; }
  .mx-wrap { overflow-x:auto; overflow-y:hidden; clip-path:inset(0); padding:6px 18px 14px; }
  .mx-grid { display:grid; min-width:max-content; }
  .mx-hc, .mx-hd { font-size:10.5px; color:var(--faint); letter-spacing:.5px; padding:5px 6px 8px; border-bottom:1px solid var(--border); text-align:center; }
  .mx-hc { position:sticky; left:0; z-index:3; background:var(--surface); }
  .mx-hd.mx-today { color:var(--accent); font-weight:700; background:rgba(184,134,11,.10); border-bottom-color:rgba(184,134,11,.45); }
  .mx-rk { position:sticky; left:0; z-index:2; background:var(--surface); font-weight:700; color:var(--sub); display:flex; align-items:center; justify-content:center; border-right:1px solid var(--border); border-bottom:1px dashed rgba(29,36,48,.6); font-size:12px; }
  .mx-rk-out { color:var(--faint); font-size:10.5px; font-weight:600; }
  .mx-cell { display:flex; align-items:center; gap:5px; padding:5px 8px 5px 7px; border-bottom:1px dashed rgba(22,32,52,.14); border-right:1px dashed rgba(22,32,52,.10); border-left:3px solid var(--mxc,#e2e8f0); min-height:34px; font-size:12px; min-width:0; }
  .mx-cell.mx-today { border-right:1px solid rgba(184,134,11,.5); box-shadow:inset 0 0 0 1px rgba(184,134,11,.18); }
  .mx-cell a { color:inherit; text-decoration:none; font-weight:600; white-space:nowrap; flex:none; }
  .mx-cell a:hover { color:#3b66d4; text-decoration:underline; }
  .mx-th { flex:none; max-width:46%; font-size:9.5px; font-weight:600; line-height:1.5; color:#fff; background:var(--mxc); border-radius:4px; padding:0 6px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .mx-th-ghost { background:transparent; color:var(--mxc); border:1px solid var(--mxc); padding:0 5px; }
  .mx-pct { margin-left:auto; flex:none; }
  .mx-cell[data-code] { cursor:pointer; }
  .mx-cell { transition:opacity .18s ease, filter .18s ease; }
  .mx-grid.mx-focus .mx-cell:not(.mx-hit) { opacity:.32; filter:saturate(.2); }
  .mx-grid.mx-focus .mx-cell.mx-today:not(.mx-hit) { box-shadow:none; }
  .mx-cell.mx-hit { outline:2px solid var(--mxc); outline-offset:-2px; }
  .mx-cell.mx-hit a { text-decoration:underline; }
  .mx-new { font-style:normal; font-size:9px; color:var(--red); border:1px solid rgba(214,52,80,.5); border-radius:4px; padding:0 3px; margin-left:2px; vertical-align:1px; flex:none; }
  .mx-rem-tag { font-size:10px; color:var(--faint); border:1px dashed var(--border2); border-radius:4px; padding:1px 6px; }
  .mx-out { opacity:.9; }
  .mx-pr { font-style:normal; font-size:9.5px; color:var(--faint); margin-left:5px; }
  .s-pct { font-size:13px; font-weight:700; text-align:right; min-width:120px; }
  .s-pct .lbinfo { display:block; font-size:10px; font-weight:400; color:var(--faint); }
  .s-sep { font-size:10.5px; color:var(--faint); }

  .tb-news { padding:14px 18px; }
  .msg { display:flex; gap:10px; padding:9px 10px; border-radius:10px; transition:background .12s; }
  .msg:hover { background:var(--surface2); }
  .msg + .msg { margin-top:4px; }
  .msg .d { flex:none; width:58px; font-size:11px; color:var(--accent); font-weight:600; padding-top:2px; }
  .msg .body .t { font-size:13px; line-height:1.5; }
  .msg .body .m { font-size:11px; color:var(--sub); margin-top:3px; display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
  .msg .m a { color:#3b66d4; text-decoration:none; }
  .msg .m a:hover { text-decoration:underline; }
  .msg .tagchip { color:var(--accent); border:1px solid rgba(232,182,76,.35); border-radius:4px; padding:0 5px; font-size:10px; }
  .msg .tagchip.bear { color:var(--green); border-color:rgba(46,189,133,.35); }
  .msg .tagchip.kline { color:#3b66d4; border-color:rgba(59,102,212,.35); }
  .msg .tagchip.risk { color:#d63450; border-color:rgba(214,52,80,.4); }
  .msg-empty { font-size:12px; color:var(--faint); padding:10px; }



  .tb-ladder { padding:10px 18px 12px; border-top:1px solid var(--border); }
  .tb-ladder .h { font-size:11px; font-weight:600; color:var(--faint); letter-spacing:1.5px; margin-bottom:8px; }
  .tb-ladder .h span { font-weight:400; letter-spacing:0; margin-left:8px; }
  .tb-anchor { margin-left:auto; font-size:11px; color:var(--accent); border:1px solid rgba(184,134,11,.35); border-radius:999px; padding:2px 10px; white-space:nowrap; }
  .tb-eco { display:flex; flex-wrap:wrap; align-items:center; gap:6px 8px; padding:9px 18px 11px; border-bottom:1px dashed var(--border); }
  .tb-eco .h { font-size:11px; font-weight:600; color:var(--faint); letter-spacing:1.5px; margin-right:4px; }
  .tb-eco .h span { font-weight:400; letter-spacing:0; color:var(--sub); margin-left:8px; }
  .eco-chip { display:inline-flex; align-items:center; gap:5px; font-size:11.5px; border:1px solid var(--border); border-radius:8px; padding:2px 8px; background:var(--surface); }
  .eco-chip a { color:inherit; text-decoration:none; font-weight:600; }
  .eco-chip a:hover { color:#3b66d4; text-decoration:underline; }
  .eco-chip b { font-size:10.5px; }
  .eco-chip.tail { border-style:dashed; color:var(--sub); }
  .lad-table { display:flex; flex-direction:column; gap:6px; }
  .lad-trow { display:grid; grid-template-columns:64px minmax(70px, 220px) 1fr; align-items:center; gap:12px; padding:4px 0; }
  .lad-trow + .lad-trow { border-top:1px dashed rgba(22,32,52,.14); }
  .lad-lb { font-size:12.5px; font-weight:700; color:var(--red); text-align:center; background:var(--red-bg); border-radius:6px; padding:3px 0; }
  .lad-lb small { display:block; font-size:9px; color:var(--faint); font-weight:400; }
  .lad-bar { height:10px; }
  .lad-bar i { display:block; height:100%; border-radius:5px; background:linear-gradient(90deg, rgba(246,70,93,.9), rgba(246,70,93,.3)); }
  .lad-cells { display:flex; flex-wrap:wrap; gap:6px; }
  .lad-cell { font-size:12.5px; font-weight:600; background:var(--surface2); border:1px solid var(--border2); border-radius:8px; padding:3px 10px; white-space:nowrap; }
  .lad-cell.outpool { color:var(--sub); font-weight:500; border-style:dashed; }
  .lad-cell em { font-style:normal; font-size:9px; color:var(--faint); margin-left:5px; vertical-align:1px; }
  .lad-empty { font-size:11.5px; color:var(--faint); }
  .msg .d { width:104px; line-height:1.35; }
  .msg .d b { display:block; font-size:10.5px; color:var(--accent); }
  .msg .d span { font-size:9.5px; color:var(--faint); }

  /* ---------- 历史行情专栏（HISTORY） ---------- */
  .hx-block { margin-top:26px; }
  /* ---------- A股历次牛市复盘（Linear 风格 · 双色规范 · 8px 网格） ---------- */
  .hx2 { --ink:#0F172A; --sub:#64748B; --faint:#94A3B8; --line:#E2E8F0; --bgp:#F8FAFC; --up:#10B981; --dn:#EF4444;
         font-family:'Inter','SF Pro Display',-apple-system,'PingFang SC',sans-serif; color:var(--ink); max-width:1440px; margin:0 auto; }
  .hx2 * { box-sizing:border-box; }
  .hx2-head { display:flex; align-items:baseline; gap:16px; flex-wrap:wrap; padding:0 0 16px; }
  .hx2-head h2 { margin:0; font-size:24px; font-weight:700; letter-spacing:-.01em; line-height:1.5; }
  .hx2-head .sub { font-size:12px; color:var(--sub); }
  .hx2-range { margin-left:auto; display:flex; align-items:center; gap:8px; font-size:12px; color:var(--sub); }
  .hx2-range select, .hx2-mobsel select { font-family:inherit; font-size:12px; color:var(--ink); background:#fff; border:1px solid var(--line); border-radius:8px; padding:6px 10px; outline:none; cursor:pointer; }
  .hx2-cyc { display:flex; gap:8px; overflow-x:auto; padding:2px 2px 12px; }
  .hx2-cyc::-webkit-scrollbar { height:6px; }
  .hx2-cyc::-webkit-scrollbar-thumb { background:var(--line); border-radius:3px; }
  .hx2-cyc .pill { flex:none; display:flex; flex-direction:column; gap:2px; align-items:flex-start; border:1px solid var(--line); background:#fff; border-radius:8px; padding:8px 14px; cursor:pointer; min-width:88px; transition:background .15s,border-color .15s; font:inherit; text-align:left; }
  .hx2-cyc .pill b { font-size:14px; font-weight:600; color:var(--ink); display:flex; align-items:center; gap:6px; }
  .hx2-cyc .pill span { font-size:12px; color:var(--sub); font-variant-numeric:tabular-nums; }
  .hx2-cyc .pill:hover { border-color:var(--ink); }
  .hx2-cyc .pill.on { background:var(--ink); border-color:var(--ink); }
  .hx2-cyc .pill.on b, .hx2-cyc .pill.on span { color:#fff; }
  .hx2-cyc .pill .live { width:6px; height:6px; border-radius:50%; background:var(--up); display:inline-block; }

function ladderHtml(theme) {
  const rows = LADDER.rows.filter(r => r.theme === theme).sort((a, b) => b.lb - a.lb);
  if (!rows.length) {
    const allCnt = (LADDER.rows || []).length;
    const othCnt = (LADDER.rows || []).filter(r => r.theme === "_other").length;
    return `<div class="lad-empty">该题材当前无连板梯队（连板≥2 快照 ${LADDER.grabbedAt}）——全市场连板≥2 共 ${allCnt} 只，其中 ${othCnt} 只未归入本期前七题材</div>`;
  }
  const lbs = [...new Set(rows.map(r => r.lb))].sort((a, b) => b - a);  // 自上而下板数递减（天梯：越往上越高）
  const maxLb = lbs[0], minLb = lbs[lbs.length - 1];
  const trs = lbs.map(lb => {
    const grp = rows.filter(r => r.lb === lb);
    const cells = grp.map(r =>
      `<span class="lad-cell${r.inPool ? "" : " outpool"}" title="${r.via}"><a href="${emQuote(r.code)}" target="_blank" title="打开东方财富行情页">${r.name}${r.inPool ? "" : '<em>池外</em>'} ↗</a></span>`).join("");
    const w = 12 + (lb - minLb + 1) / (maxLb - minLb + 1) * 88;
    return `<div class="lad-trow">
      <span class="lad-lb num">${lb}板<small>${grp.length}只</small></span>
      <span class="lad-bar"><i style="width:${w.toFixed(0)}%"></i></span>
      <span class="lad-cells">${cells}</span>
    </div>`;
  }).join("");
  return `<div class="lad-table">${trs}</div>`;
}

const THEME_COLOR_CACHE = {};

  if (t === "—") return (THEME_COLOR_CACHE[t] = { vivid: "#8a94a6", tint: "#f2f4f7" });
  const h = Math.round(_themeHi * 137.508) % 360, [s, l] = _SL[_themeHi % 4];
  _themeHi++;
  return (THEME_COLOR_CACHE[t] = { vivid: `hsl(${h},${s}%,${l}%)`, tint: `hsl(${h},${Math.min(s, 50)}%,96%)` });
}

  const pct = v => { const n = parseFloat(v); return isNaN(n) ? "—" : `<span class="mx-pct num ${pctCls(n)}">${(n > 0 ? "+" : "") + n.toFixed(2)}%</span>`; };
  const prevSet = new Set();
  (P.rankRows || []).forEach(r => { const c = (r.cells || {})[prevDate]; if (c) prevSet.add(c.code); });
  let newCnt = 0;
  (P.rankRows || []).forEach(r => { const c = (r.cells || {})[today]; if (c && prevDate && !prevSet.has(c.code)) newCnt++; });

  /* 逐日新进判定：每一列 vs 其前一列（首列不标）——新进标的首日格子带“新”角标，
     与移除区 3 行溯源同理，收盘基线覆盖不丢“新”标（当日盘中新进亦可在其上榜首日列看到） */
  const colSet = {}, prevColOf = {};
  dates.forEach((d, i) => {
    const s = new Set();
    (P.rankRows || []).forEach(r => { const c = (r.cells || {})[d]; if (c) s.add(c.code); });
    colSet[d] = s;
    prevColOf[d] = i > 0 ? dates[i - 1] : null;
  });

  /* 配色策略（专业数据面板三层信号：题材=色签+色条，名次=彩虹字，强弱=底色）：
     题材色：黄金角色相+饱和度/明度交替 → vivid（色签底/色条/联动描边，白字对比≥4.5:1）与 tint（极浅底）；
     当日前七标的：极浅题材底 + 彩虹名次字 + 实心题材色签（白字）；
     其余历史格与移除行：白底 + 中性灰字 + 幽灵色签（vivid 描边/文字），题材可辨但不抢焦点 */
  const NEUTRAL = { fg: "#5c6675" };
  const themeOf = themeColorOf;
  /* 标的字体色：仅当日（最新列）前七的标的按今日名次取彩虹色（同一标的跨列同色）；
     不在当日前七的标的与移除行均为中性灰（不着色） */
  const fgOfCode = {};
  (P.rankRows || []).forEach(r => { const c = (r.cells || {})[today]; if (c) fgOfCode[c.code] = (RAINBOW[r.rank - 1] || NEUTRAL).fg; });

  let grid = `<div class="mx-hc">排名</div>` + dates.map(d =>
    `<div class="mx-hd${d === today ? " mx-today" : ""}">${(P.labels || {})[d] || d.slice(5).replace("-", "")}</div>`).join("");
  (P.rankRows || []).forEach(r => {
    grid += `<div class="mx-rk num">#${r.rank}</div>` + dates.map(d => {
      const c = (r.cells || {})[d];
      const td = d === today ? " mx-today" : "";
      if (!c) return `<div class="mx-cell${td}"></div>`;
      const isNew = prevColOf[d] && !colSet[prevColOf[d]].has(c.code);
      const C = themeOf(th(c.code));
      const cur = c.code in fgOfCode;
      const fg = cur ? fgOfCode[c.code] : NEUTRAL.fg;
      return `<div class="mx-cell${td}" data-code="${c.code}" style="--mxc:${C.vivid};color:${fg}${cur ? `;background:${C.tint}` : ""}" title="${c.name} · 本月第${r.rank}名 · ${th(c.code)} · 本月${c.month_pct}% · 点击联动高亮同一标的"><a href="${emQuote(c.code)}" target="_blank" title="打开东方财富行情页">${c.name}</a>${isNew ? '<i class="mx-new">新</i>' : ""}<span class="mx-th${cur ? "" : " mx-th-ghost"}">${th(c.code)}</span>${pct(c.month_pct)}</div>`;
    }).join("");
  });
  /* 榜外第 8-10 名（灰色名次行）：优先 tailRows=每日第 8/9/10 名实际标的逐日呈现（不留空，缺失格显示 —）；
     无 tailRows 的旧快照回退：tail（今日榜外标的轨迹行）→ 最近 3 个退出标的派生展示 */
  const todaySet = new Set();
  (P.rankRows || []).forEach(r => { const c = (r.cells || {})[today]; if (c) todaySet.add(c.code); });
  const lastSeen = {}, tenure = {};
  dates.forEach(d => (P.rankRows || []).forEach(r => {
    const c = (r.cells || {})[d];
    if (!c || d === today) return;
    const t = (tenure[c.code] = tenure[c.code] || { code: c.code, name: c.name, cells: {} });
    lastSeen[c.code] = d;
    t.cells[d] = { rank: r.rank, month_pct: c.month_pct };
  }));
  const labelOf = d => (P.labels || {})[d] || String(d).slice(5).replace("-", "");
  const tailMode = Array.isArray(P.tail) && P.tail.length > 0;
  const tailRowMode = Array.isArray(P.tailRows) && P.tailRows.length > 0;
  const todayExitCnt = (P.removed || []).length;
  /* 榜外行新进判定基于全十行 occupants 集合（每一列 vs 其前一列） */
  const colSetAll = {};
  dates.forEach(d => {
    const s = new Set(colSet[d] || []);
    (P.tailRows || []).forEach(r => { const c = (r.cells || {})[d]; if (c) s.add(c.code); });
    colSetAll[d] = s;
  });
  let remShown = [], remNote = "";
  if (tailRowMode) {
    (P.tailRows || []).forEach(r => {
      grid += `<div class="mx-rk mx-rk-out" title="榜外名次行：当日第 ${r.rank} 名实际标的（灰色系置灰）">#${r.rank}</div>` + dates.map(d => {
        const c = (r.cells || {})[d];
        const td = d === today ? " mx-today" : "";
        if (!c) return `<div class="mx-cell${td}" style="display:flex;align-items:center;justify-content:center"><span class="mx-rem-tag" title="该日无第 ${r.rank} 名数据（接口未返回）">—</span></div>`;
        const C = themeOf(th(c.code));
        const isNew = prevColOf[d] && !(colSetAll[prevColOf[d]] || new Set()).has(c.code);
        const status = d === today ? (prevSet.has(c.code) ? "今日退出前七" : "未入前七") : null;
        return `<div class="mx-cell${td} mx-out" data-code="${c.code}" style="--mxc:${C.vivid};color:${NEUTRAL.fg}" title="${c.name} · 当日第${r.rank}名（榜外） · ${th(c.code)} · 本月${c.month_pct}% · 点击联动高亮同一标的"><a href="${emQuote(c.code)}" target="_blank" title="打开东方财富行情页">${c.name}</a>${isNew ? '<i class="mx-new">新</i>' : ""}${status ? `<span class="mx-rem-tag">${status}</span>` : ""}<span class="mx-th mx-th-ghost">${th(c.code)}</span>${pct(c.month_pct)}</div>`;
      }).join("");
    });
    remShown = (P.tailRows || []).map(r => { const c = (r.cells || {})[today]; return c ? { code: c.code, name: c.name, rk810: r.rank } : null; }).filter(Boolean);
    remNote = remShown.map(s => `${s.name}（榜外#${s.rk810} · ${prevSet.has(s.code) ? "今日自前七退出" : "未入前七"}）`).join("；")
      + ((P.removed || []).length ? `；今日退出前七且跌出前十：${(P.removed || []).map(s => s.name + (s.note ? "（" + s.note + "）" : "")).join("、")}` : "");
  } else {
    let remRows;
    if (tailMode) {
      remRows = P.tail.map(t => ({
        code: t.code, name: t.name, rk810: t.rank, month_pct: t.month_pct,
        cells: (tenure[t.code] || {}).cells || {}, exitD: t.last_in7 || null
      }));
    } else {
      const scriptRem = new Map((P.removed || []).map(s => [s.code, s]));
      remRows = Object.keys(lastSeen).filter(cd => !todaySet.has(cd))
        .sort((a, b) => (lastSeen[a] < lastSeen[b] ? 1 : -1))
        .map(cd => { const s = scriptRem.get(cd);
          return s ? Object.assign({}, s, { cells: (tenure[cd] || {}).cells || s.cells }) : tenure[cd]; });
      (P.removed || []).forEach(s => { if (!todaySet.has(s.code) && !remRows.find(x => x.code === s.code)) remRows.push(s); });
      remRows = remRows.slice(0, 3);
    }
    remShown = remRows;
    remShown.forEach(s => {
      const exitD = tailMode ? s.exitD : (lastSeen[s.code] || prevDate);
      const rkLabel = tailMode ? ("#" + s.rk810) : "移除";
      const status = exitD ? (exitD === prevDate ? "今日退出前七" : labelOf(exitD) + " 退出前七") : "未入前七";
      grid += `<div class="mx-rk mx-rk-out" title="${exitD ? "最后在榜前七 " + labelOf(exitD) : "本月在榜外"}">${rkLabel}</div>` + dates.map(d => {
        if (d === today && tailMode) {
          const C = themeOf(th(s.code));
          return `<div class="mx-cell mx-today mx-out" data-code="${s.code}" style="--mxc:${C.vivid};color:${NEUTRAL.fg}" title="${s.name} · 榜外第${s.rk810}名 · ${th(s.code)} · 本月${s.month_pct}% · ${status} · 点击联动高亮同一标的"><a href="${emQuote(s.code)}" target="_blank" title="打开东方财富行情页">${s.name}</a><span class="mx-rem-tag">${status}</span><span class="mx-th mx-th-ghost">${th(s.code)}</span><span class="mx-pct num">${pct(s.month_pct)}</span></div>`;
        }
        if (d === today) return `<div class="mx-cell mx-today" style="display:flex;align-items:center;justify-content:center"><span class="mx-rem-tag">${status}</span></div>`;
        const c = (s.cells || {})[d];
        if (!c) return `<div class="mx-cell"></div>`;
        const C = themeOf(th(s.code));
        return `<div class="mx-cell mx-out" data-code="${s.code}" style="--mxc:${C.vivid};color:${NEUTRAL.fg}" title="${s.name} · ${th(s.code)}${exitD ? " · 最后在榜前七 " + labelOf(exitD) : ""} · 本月（当期）${c.month_pct}% · 点击联动高亮同一标的"><a href="${emQuote(s.code)}" target="_blank" title="打开东方财富行情页">${s.name}</a><span class="mx-th mx-th-ghost">${th(s.code)}</span><span class="mx-pct num">${pct(c.month_pct)}<em class="mx-pr">#${c.rank}</em></span></div>`;
      }).join("");
    });
    remNote = remShown.map(s => {
      const exitD = tailMode ? s.exitD : (lastSeen[s.code] || prevDate);
      const pos = tailMode ? "榜外#" + s.rk810 : "退出";
      return `${s.name}（${pos}${exitD ? " · 最后在榜前七 " + labelOf(exitD) : " · 本月未入过前七"}）${s.note ? " · " + s.note : ""}`;
    }).join("；");
  }
  el.innerHTML = `<div class="theme-block mx-block">
    <div class="tb-head"><span class="tb-dot"></span><span class="tb-name">月度前七 · 当月全景</span>
      <span class="tb-span num">${dates[0].slice(5).replace("-", "/")} → ${dates[dates.length - 1].slice(5).replace("-", "/")} · ${dates.length} 个交易日</span>
      ${P.baseline ? `<span class="st st-mid">首次记录 · 无对比基线</span>`
                   : `<span class="st st-hot">较昨日新进 ${newCnt}</span><span class="st st-cool">今日退出前七 ${todayExitCnt} · 榜外 8-10 名次行</span>`}
    </div>
    <div class="mx-wrap"><div class="mx-grid" style="grid-template-columns:52px repeat(${dates.length}, minmax(168px, 230px))">${grid}</div></div>
  </div>`;

  /* 点击格子联动高亮同一标的（点击名称链接不拦截）；聚焦时未命中单元格弱化，再次点击取消 */
  el.addEventListener("click", e => {
    if (e.target.closest("a")) return;
    const cell = e.target.closest(".mx-cell[data-code]");
    if (!cell) return;
    const grid = el.querySelector(".mx-grid");
    const code = cell.dataset.code;
    const wasOn = cell.classList.contains("mx-hit");
    el.querySelectorAll(".mx-cell.mx-hit").forEach(c => c.classList.remove("mx-hit"));
    if (grid) grid.classList.remove("mx-focus");
    if (!wasOn) {
      el.querySelectorAll(`.mx-cell[data-code="${code}"]`).forEach(c => c.classList.add("mx-hit"));
      if (grid) grid.classList.add("mx-focus");
    }
  });
  /* 点击可选格子以外的任意位置（页面空白/表头/其他区块）取消聚焦 */
  document.addEventListener("click", e => {
    if (e.target.closest(".mx-cell[data-code]")) return;
    if (!el.querySelector(".mx-cell.mx-hit")) return;
    el.querySelectorAll(".mx-cell.mx-hit").forEach(c => c.classList.remove("mx-hit"));
    const grid = el.querySelector(".mx-grid");
    if (grid) grid.classList.remove("mx-focus");
  });
})();

/* ---------- 渲染题材区块 ---------- */
const blocks = document.getElementById("blocks");
const navChips = document.getElementById("navChips");
const TL = TIMELINE;

TL.forEach((tl, bi) => {
  /* 个股行（题材梯队：前七锚定股在前、同题材池外梯队员在后） */

  const newsNodes = tl.nodes;
  const newsHtml = newsNodes.map(nd => `

     “无当日催化”标注对全部区块兜底（模型判定缺失时模板按节点事实自动补） */
  const hasNews = (tl.nodes || []).some(nd => nd.kind !== "kline" && nd.kind !== "note");
  const ladRowsThem = (LADDER.rows || []).filter(r => r.theme === tl.theme);

  /* 题材涨幅梯队（月度）：TOP7 锚定溯源链——锚定股名次签 + 前七/榜外/池外成员按月涨幅呈现 */
  const todayCells = {};
  (POOLCHG.rankRows || []).forEach(r => { const c = (r.cells || {})[POOLCHG.today]; if (c) todayCells[c.code] = { rank: r.rank, mp: parseFloat(c.month_pct) }; });
  (POOLCHG.tail || []).forEach(t => { if (!(t.code in todayCells)) todayCells[t.code] = { rank: t.rank, tail: true, mp: parseFloat(t.month_pct) }; });
  const anchor = stocks.filter(s => !s.out && s.rk >= 1 && s.rk <= 7).sort((a, b) => a.rk - b.rk)[0];
  const ecoTail = (POOLCHG.tail || []).filter(t => ((POOLCHG.ecoThemes || {})[t.code] || null) === tl.theme);
  const ecoLadder = LADDER.rows.filter(r => r.theme === tl.theme && !r.inPool);
  const ecoHtml = `
    <div class="tb-eco">
      <span class="h">题材涨幅榜梯队（月度）<span>${anchor ? "TOP#" + anchor.rk + " " + anchor.name + " ↦ " + tl.theme : "无前七锚定标的"}</span></span>
      ${stocks.map(s => { const tc = todayCells[s.code] || {};
        return `<span class="eco-chip${s.out ? " tail" : ""}"><a href="${emQuote(s.code)}" target="_blank" title="打开东方财富行情页" style="${(!s.out && s.rk >= 1 && s.rk <= 7) ? "color:" + RAINBOW[s.rk - 1].fg + ";" : ""}">${s.out ? "池外·" : (tc.rank ? "#" + tc.rank + " " : "")}${s.name}</a><b class="num ${pctCls(tc.mp)}">${tc.mp != null ? pctTxt(tc.mp) : (s.out ? "梯队员" : "—")}</b></span>`; }).join("")}
      ${ecoTail.map(t => `<span class="eco-chip tail"><a href="${emQuote(t.code)}" target="_blank" title="榜外成员（退出前七仍在前十）">榜外#${t.rank} ${t.name}</a><b class="num ${pctCls(parseFloat(t.month_pct))}">+${t.month_pct}%</b></span>`).join("")}
      ${ecoLadder.map(r => `<span class="eco-chip tail" title="${r.via || ""}"><a href="${emQuote(r.code)}" target="_blank">池外 ${r.name} · ${r.lb}板</a></span>`).join("")}
    </div>`;

  const headHtml = `
    <div class="tb-head">
      <span class="tb-dot"></span>
      <span class="tb-name">${tl.theme}</span>
      <span class="tb-span num">${tl.span}</span>
      <span class="st st-${tl.st}">${tl.status}</span>
      ${!hasNews ? `<span class="st st-mid" title="该题材本期无当日催化消息（仅行情确认节点），按题材轮动/资金驱动看待">无当日催化 · 轮动/资金驱动</span>` : ""}
      ${tl.risk ? `<span class="st st-risk" title="${tl.riskNote || ""}">⚠ ${tl.risk}</span>` : ""}
      ${anchor ? `<span class="tb-anchor num" title="题材锚定：本月第 ${anchor.rk} 名标的（溯源链：TOP#${anchor.rk} ${anchor.name} → ${tl.theme} → 题材涨幅榜梯队）">锚定 TOP#${anchor.rk} ${anchor.name}</span>` : ""}
    </div>`;

  /* 紧凑形态：单股 + 无当日催化 + 无梯队 → 头部＋一行个股卡＋行情确认摘要（去掉 400px 双栏骨架与天梯空态行） */
  if (stocks.length <= 1 && !hasNews && ladRowsThem.length === 0) {
    const jjTxt = s => (typeof s.jj === "number" && isFinite(s.jj)) ? pctTxt(s.jj) : "—";
    const hsTxt = s => (typeof s.hs === "number" && isFinite(s.hs)) ? s.hs.toFixed(1) + "%" : "—";
    const chips = stocks.map(s => `<span class="eco-chip"><a href="${emQuote(s.code)}" target="_blank" title="打开东方财富行情页" style="${(!s.out && s.rk >= 1 && s.rk <= 7) ? "color:" + RAINBOW[s.rk - 1].fg + ";" : ""}">${(!s.out && s.rk >= 1 && s.rk <= 7) ? "#" + s.rk + " " : ""}${s.name} ↗</a><b class="num ${pctCls(s.pct)}">${pctTxt(s.pct)}</b><small class="num" style="font-size:11px;color:var(--sub)">竞价 ${jjTxt(s)} · 换手 ${hsTxt(s)}</small></span>`).join("")
      + ecoTail.map(t => `<span class="eco-chip tail"><a href="${emQuote(t.code)}" target="_blank" title="榜外成员（退出前七仍在前十）">榜外#${t.rank} ${t.name}</a><b class="num ${pctCls(parseFloat(t.month_pct))}">+${t.month_pct}%</b></span>`).join("");
    const nodeLine = (tl.nodes || []).map(nd => `<span class="num" style="color:var(--accent);font-weight:600">${(nd.d || "").slice(5)}</span> ${String(nd.t || "").slice(0, 44)}${nd.url ? ` <a href="${nd.url}" target="_blank" style="color:#3b66d4;text-decoration:none">原文 ↗</a>` : ""}`).join("<br>");
    block.innerHTML = headHtml + `
      <div class="tb-eco" style="border-top:none">
        <span class="h">个 股 · ${stocks.length} 只<span>无连板梯队 · 无当日催化</span></span>
        ${chips || `<span class="lad-empty">该分组无股池标的</span>`}
      </div>
      ${nodeLine ? `<div style="padding:0 18px 14px;font-size:12px;color:var(--sub);line-height:1.8">${nodeLine}</div>` : ""}`;
  } else {
  block.innerHTML = headHtml + `
    ${ecoHtml}
    <div class="tb-ladder" style="border-top:none"><div class="h">连板梯队（连板≥2，含同题材池外标的）<span>快照 ${LADDER.grabbedAt} · 悬停看归属依据</span></div>${ladderHtml(tl.theme)}</div>
    <div class="tb-body">
      <div class="tb-stocks"><h4>个 股 · ${stocks.length} 只</h4>${stocksHtml}</div>
      <div class="tb-news"><h4>消息序列 · 点击“原文”跳转首发/发酵报道</h4>${newsHtml}</div>
    </div>`;
  }
  blocks.appendChild(block);

  const chip = document.createElement("a");
  chip.href = "#blk" + bi; chip.textContent = tl.theme;
  navChips.appendChild(chip);

});

/* ---------- hero 徽章：由数据现算（builder 只注入“快照”徽章时间，统计徽章禁止手填，防样例残留与数据打架） ---------- */
(function() {
  const el = document.getElementById("heroBadges");
  if (!el) return;
  const add = h => el.insertAdjacentHTML("beforeend", h);
  const todayCellsOf = P => {
    const out = new Set();
    ((P && P.rankRows) || []).forEach(r => { const c = (r.cells || {})[P.today]; if (c) out.add(c.code); });
    return out;
  };
  if (typeof TIMELINE !== "undefined" && Array.isArray(TIMELINE)) add(`<span class="badge">题材 <b>${TIMELINE.length} 组</b></span>`);
  let mCnt = null, dCnt = null, topCnt = null;
  if (typeof STOCKS !== "undefined" && Array.isArray(STOCKS)) {
    mCnt = STOCKS.filter(s => s.pool === "month" && !s.out).length;
    dCnt = STOCKS.filter(s => s.pool === "d10" && !s.out).length;
    topCnt = STOCKS.filter(s => s.top).length;
  }
  if (typeof POOLCHG !== "undefined" && POOLCHG && POOLCHG.today) {
    const ts = todayCellsOf(POOLCHG);
    if (ts.size) mCnt = ts.size;
    if (typeof D10CHG !== "undefined" && D10CHG && D10CHG.today) {
      const ds = todayCellsOf(D10CHG);
      if (ds.size) dCnt = ds.size;
      let inter = 0; ts.forEach(c => { if (ds.has(c)) inter++; });
      if (inter > 0) topCnt = Math.max(topCnt || 0, inter);   /* 矩阵交集优先，STOCKS.top 缺填时兜底 */
    }
  }
  if (mCnt != null && dCnt != null) add(`<span class="badge">月度前七 <b>${mCnt} 只</b> ｜ 近十日三强 <b>${dCnt} 只</b></span>`);
  if (topCnt > 0) add(`<span class="badge">★最强 <b>${topCnt} 只</b>（双窗共振）</span>`);
  if (typeof POOLCHG !== "undefined" && POOLCHG && Array.isArray(POOLCHG.dates) && POOLCHG.dates.length) {
    const P = POOLCHG, dates = P.dates, prev = P.prevDate;
    const prevSet = new Set();
    if (prev) (P.rankRows || []).forEach(r => { const c = (r.cells || {})[prev]; if (c) prevSet.add(c.code); });
    let newCnt = 0;
    (P.rankRows || []).forEach(r => { const c = (r.cells || {})[P.today]; if (c && prev && !prevSet.has(c.code)) newCnt++; });
    const remCnt = (P.removed || []).length;
    add(`<span class="badge">当月全景 <b>${dates.length} 日</b> · 新进 <b>${newCnt}</b>/移除 <b>${remCnt}</b></span>`);
  }
  if (typeof TIMELINE !== "undefined" && Array.isArray(TIMELINE)) {
    const riskCnt = TIMELINE.filter(t => t.risk).length;
    if (riskCnt > 0) add(`<span class="badge">抢跑警示 <b>${riskCnt} 组</b></span>`);
  }
})();

/* ---------- A股历次牛市复盘（Linear 风格：轮次导航条 · 主图分区 · 指标卡 · 洞察区） ---------- */
(function() {
  const el = document.getElementById("history");
  if (!el || typeof HISTORY === "undefined") return;
  const R = (HISTORY.rounds || []).slice().sort((a, b) => a.id - b.id);
  const Y = HISTORY.year;
  const UP = "#10B981", DN = "#EF4444", INK = "#0F172A";
  const fmtD = k => { const s = String(k); return s.slice(0, 4) + "/" + s.slice(4, 6) + "/" + s.slice(6, 8); };
  const fmtP = p => p == null ? "—" : Number(p).toFixed(2);
  const sY = d => String(d).slice(2, 4);
  let hxSel = R.length ? R[R.length - 1].id : "yr";
  let hxRange = "all";
  let CUR = null;   /* 悬停数据：{S, dates, mode} */
  const inRange = id => hxRange === "all" || (hxRange === "a" && id <= 5) || (hxRange === "b" && id >= 6 && id <= 7) || (hxRange === "c" && id >= 8);

  /* —— 轮次主图：对数刻度 · 启动(中性)/主升(绿)/退潮(红) 分区 · 悬停读点 —— */
  function chart(r) {
    const S = r.spark || [];
    if (S.length < 3 || !r.zi || r.zi.length < 3) return "";
    const W = 1280, H = 420, pl = 8, pr = 76, pt = 40, pb = 44;
    const n = S.length, pw = W - pl - pr, ph = H - pt - pb;
    const x = i => pl + pw * i / (n - 1);
    const vals = S.map(p => p[1]);
    const lo = Math.min(...vals), hi = Math.max(...vals);
    const ln = Math.log, span = (ln(hi) - ln(lo)) || 1;
    const y = v => pt + ph * (1 - (ln(v) - ln(lo)) / span);
    const i1 = r.zi[1], i2 = r.zi[2], i3 = (r.zi[3] != null ? r.zi[3] : n - 1);
    const P = [];
    [{ a: 0, b: i1, f: "rgba(15,23,42,.04)", t: "启动区", c: "#64748B" },
     { a: i1, b: i2, f: "rgba(16,185,129,.10)", t: "主升区", c: UP },
     { a: i2, b: n - 1, f: "rgba(239,68,68,.08)", t: r.ongoing ? "退潮区 · 进行中" : "退潮区", c: DN }].forEach(z => {
      if (z.b <= z.a) return;
      P.push('<rect x="' + x(z.a).toFixed(1) + '" y="' + pt + '" width="' + (x(z.b) - x(z.a)).toFixed(1) + '" height="' + ph + '" fill="' + z.f + '"/>');
      if (x(z.b) - x(z.a) >= 56) P.push('<text x="' + ((x(z.a) + x(z.b)) / 2).toFixed(1) + '" y="' + (pt - 12) + '" text-anchor="middle" font-size="12" font-weight="600" fill="' + z.c + '">' + z.t + '</text>');
      if (z.b < n - 1) P.push('<line x1="' + x(z.b).toFixed(1) + '" y1="' + pt + '" x2="' + x(z.b).toFixed(1) + '" y2="' + (pt + ph) + '" stroke="#CBD5E1" stroke-dasharray="4 4" stroke-width="1"/>');
    });
    [hi, Math.exp((ln(hi) + ln(lo)) / 2), lo].forEach(v => {
      P.push('<line x1="' + pl + '" y1="' + y(v).toFixed(1) + '" x2="' + (W - pr + 6) + '" y2="' + y(v).toFixed(1) + '" stroke="#F1F5F9" stroke-width="1"/>');
      P.push('<text x="' + (W - pr + 12) + '" y="' + (y(v) + 4).toFixed(1) + '" font-size="12" fill="#94A3B8">' + fmtP(v) + '</text>');
    });
    P.push('<text x="' + (W - pr + 12) + '" y="' + (pt - 12) + '" font-size="12" fill="#94A3B8">对数</text>');
    for (let k = 0; k <= 5; k++) {
      const i = Math.round((n - 1) * k / 5);
      P.push('<text x="' + x(i).toFixed(1) + '" y="' + (H - 14) + '" text-anchor="' + (k === 0 ? "start" : k === 5 ? "end" : "middle") + '" font-size="12" fill="#94A3B8">' + fmtD(S[i][0]).slice(2) + '</text>');
    }
    P.push('<polyline points="' + S.map((p, i) => x(i).toFixed(1) + "," + y(p[1]).toFixed(1)).join(" ") + '" fill="none" stroke="' + INK + '" stroke-width="2" stroke-linejoin="round"/>');
    const tail = r.ongoing ? r.cur : r.ebb;
    [[0, UP], [i1, UP], [i2, INK], [i3, DN]].forEach(a => {
      if (a[0] == null || a[0] >= n) return;
      P.push('<circle cx="' + x(a[0]).toFixed(1) + '" cy="' + y(S[a[0]][1]).toFixed(1) + '" r="4" fill="' + a[1] + '" stroke="#fff" stroke-width="1.5"/>');
    });
    P.push('<line id="hx2gl" x1="0" y1="' + pt + '" x2="0" y2="' + (pt + ph) + '" stroke="#64748B" stroke-width="1" opacity="0"/>');
    P.push('<circle id="hx2dot" r="4.5" fill="' + INK + '" stroke="#fff" stroke-width="1.5" opacity="0"/>');
    P.push('<rect id="hx2ov" x="' + pl + '" y="' + pt + '" width="' + pw + '" height="' + ph + '" fill="transparent"/>');
    CUR = { S: S, x0: pl, pw: pw, pt: pt, y: y };
    return '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="第' + r.id + '轮走势">' + P.join("") + '</svg>';
  }

  /* —— 2026 年内：三指数归一化（中性色阶）＋事件竖线 —— */
  function yearChart() {
    const S = Y.series || [];
    if (!S.length || !Y.dates || !Y.dates.length) return "";
    const W = 1280, H = 420, pl = 8, pr = 76, pt = 40, pb = 44;
    const n = Y.dates.length, pw = W - pl - pr, ph = H - pt - pb;
    const x = i => pl + pw * i / (n - 1);
    let lo = 1e9, hi = -1e9;
    S.forEach(s2 => s2.data.forEach(v => { lo = Math.min(lo, v); hi = Math.max(hi, v); }));
    const y = v => pt + ph * (1 - (v - lo) / ((hi - lo) || 1));
    const P = [];
    [hi, (hi + lo) / 2, lo].forEach(v => {
      P.push('<line x1="' + pl + '" y1="' + y(v).toFixed(1) + '" x2="' + (W - pr + 6) + '" y2="' + y(v).toFixed(1) + '" stroke="#F1F5F9" stroke-width="1"' + (v === 100 ? ' stroke-dasharray="2 3" stroke="#CBD5E1"' : '') + '/>');
      P.push('<text x="' + (W - pr + 12) + '" y="' + (y(v) + 4).toFixed(1) + '" font-size="12" fill="#94A3B8">' + Math.round(v) + '</text>');
    });
    for (let k = 0; k <= 5; k++) {
      const i = Math.round((n - 1) * k / 5);
      P.push('<text x="' + x(i).toFixed(1) + '" y="' + (H - 14) + '" text-anchor="' + (k === 0 ? "start" : k === 5 ? "end" : "middle") + '" font-size="12" fill="#94A3B8">' + String(Y.dates[i]).slice(4) + '</text>');
    }
    (Y.marks || []).forEach(mk => {
      const idx = Y.dates.indexOf(mk);
      if (idx < 0) return;
      P.push('<line x1="' + x(idx).toFixed(1) + '" y1="' + pt + '" x2="' + x(idx).toFixed(1) + '" y2="' + (pt + ph) + '" stroke="#CBD5E1" stroke-dasharray="4 4" stroke-width="1"/>');
    });
    S.forEach(s2 => {
      P.push('<polyline points="' + s2.data.map((v, i2) => x(i2).toFixed(1) + "," + y(v).toFixed(1)).join(" ") + '" fill="none" stroke="' + s2.color + '" stroke-width="1.8"/>');
    });
    const lgd = S.map(s2 => '<span style="display:inline-flex;align-items:center;gap:5px;margin-right:14px;font-size:12px;color:#64748B"><i style="width:10px;height:2px;background:' + s2.color + ';display:inline-block"></i>' + s2.nm + '</span>').join("");
    P.push('<line id="hx2gl" x1="0" y1="' + pt + '" x2="0" y2="' + (pt + ph) + '" stroke="#64748B" stroke-width="1" opacity="0"/>');
    P.push('<circle id="hx2dot" r="4.5" fill="' + INK + '" stroke="#fff" stroke-width="1.5" opacity="0"/>');
    P.push('<rect id="hx2ov" x="' + pl + '" y="' + pt + '" width="' + pw + '" height="' + ph + '" fill="transparent"/>');
    CUR = { S: S.map(s2 => s2.data), dates: Y.dates, year: true, x0: pl, pw: pw, pt: pt, y: y, names: S.map(s2 => s2.nm) };
    return '<div style="position:absolute;top:2px;left:8px;z-index:1;pointer-events:none">' + lgd + '</div><svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="2026年内三指数归一化">' + P.join("") + '</svg>';
  }

  function metrics(r) {
    const tail = r.ongoing ? r.cur : r.ebb;
    const m = (k, v, d, cls) => '<div class="hx2-m ' + (cls || "") + '"><div class="k">' + k + '</div><div class="v">' + v + '</div><div class="d">' + (d || "") + '</div></div>';
    return '<div class="hx2-metrics">'
      + m("主升涨幅", "+" + r.gain + "%", r.start.d + " → " + r.peak.d, "up")
      + m(r.ongoing ? "退潮最大回撤" : "退潮回撤", tail.dd + "%", r.peak.d + " → " + tail.d, "dn")
      + m("交易天数", r.td == null ? "—" : r.td, "主升指数：" + r.lead)
      + m("启动低点", fmtP(r.start.p), r.start.d)
      + m("见顶", fmtP(r.peak.p), r.peak.d)
      + m(r.ongoing ? "退潮至今最低" : "退潮底", fmtP(tail.p), tail.d)
      + '</div>';
  }

  function yearMetrics() {
    const m = (k, v, d, cls) => '<div class="hx2-m ' + (cls || "") + '"><div class="k">' + k + '</div><div class="v">' + v + '</div><div class="d">' + (d || "") + '</div></div>';
    return '<div class="hx2-metrics">' + Y.idx.map(o =>
      m(o.nm + " · 年内", o.ytd + "%", "现距峰 " + o.ddNow + "%", o.ytd >= 0 ? "up" : "dn")).join("")
      + Y.idx.map(o => m(o.nm + " · 盘中", fmtP(o.last.p), "高 " + o.high.p + " · 低 " + o.low.p)).join("") + '</div>';
  }

  function insights(r) {
    const evs = (r.events || []).map(e => '<div class="hx2-ev"><b>' + e.d + '</b><div>' + e.t + ' <a href="' + e.url + '" target="_blank">' + e.src + ' ↗</a></div></div>').join("");
    const ana = r.ana ? [["驱动", r.ana.drv], ["结构", r.ana.str], ["主线", r.ana.thm]].map(a =>
      '<div class="row"><span class="tag">' + a[0] + '</span><p>' + a[1] + '</p></div>').join("") : "";
    const alt = r.alt ? '<div class="row"><span class="tag">对照</span><p>' + r.alt.idx + ' ' + r.alt.span + ' 主升 +' + r.alt.gain + '%' + (r.alt.tail ? " · " + r.alt.tail : "") + '</p></div>' : "";
    const ths = (r.themes || []).length ? '<div class="hx2-ths">' + r.themes.map(t => '<i>' + t + '</i>').join("") + '</div>' : "";
    return '<div class="hx2-ins"><div><h4>关键事件 · 史料源</h4><div class="hx2-evs">' + (evs || '<p style="font-size:14px;color:#94A3B8;margin:0">—</p>') + '</div></div>'
      + '<div class="hx2-ana"><h4>驱动 / 结构 / 主线</h4>' + ana + alt + ths + (r.note ? '<div class="hx2-note">' + r.note + '</div>' : "") + '</div></div>';
  }

  function yearInsights() {
    const evs = (Y.events || []).map(e => '<div class="hx2-ev"><b>' + e.d + '</b><div>' + e.t + ' <a href="' + e.url + '" target="_blank">' + e.src + ' ↗</a></div></div>').join("");
    return '<div class="hx2-ins"><div><h4>事件节点 · 史料源</h4><div class="hx2-evs">' + (evs || '<p style="font-size:14px;color:#94A3B8;margin:0">—</p>') + '</div></div>'
      + '<div class="hx2-ana"><h4>节奏</h4>' + (Y.rhythm ? '<div class="row"><span class="tag">节奏</span><p>' + Y.rhythm + '</p></div>' : "") + '</div></div>';
  }

  function roundView(r) {
    const tail = r.ongoing ? r.cur : r.ebb;
    return '<div class="hx2-card hx2-fade">'
      + '<div class="hx2-tt"><h3>' + r.name + '</h3><span class="badge">第' + r.id + '轮 · ' + r.status + '</span>'
      + '<span class="dates">' + r.start.d + " → " + ((r.ongoing && r.last) ? r.last.d : tail.d) + '</span></div>'
      + '<div class="hx2-chartwrap">' + chart(r) + '<div class="hx2-tip" id="hx2tip"></div></div>'
      + metrics(r) + insights(r) + '</div>';
  }

  function yearView() {
    return '<div class="hx2-card hx2-fade">'
      + '<div class="hx2-tt"><h3>2026 年内 · 完整波段复盘</h3><span class="badge">归一化 基点 100＝2025 年末</span>'
      + '<span class="dates">2026/01/01 → ' + Y.asOf + ' · ' + Y.td + ' 交易日</span></div>'
      + '<div class="hx2-chartwrap">' + yearChart() + '<div class="hx2-tip" id="hx2tip"></div></div>'
      + yearMetrics() + yearInsights() + '</div>';
  }

  function pills() {
    const list = R.filter(r => inRange(r.id));
    return list.map(r => '<button class="pill' + (hxSel === r.id ? " on" : "") + '" data-hx="' + r.id + '" title="第' + r.id + '轮 · ' + r.name + '"><b>第' + r.id + '轮' + (r.ongoing ? '<i class="live" title="进行中"></i>' : "") + '</b><span>' + sY(r.start.d) + "–" + (r.ongoing ? "今" : sY((r.ongoing ? r.cur : r.ebb).d)) + '</span></button>').join("")
      + ((Y && (hxRange === "all" || hxRange === "c")) ? '<button class="pill' + (hxSel === "yr" ? " on" : "") + '" data-hx="yr" title="2026 年内三指数归一化走势"><b>2026 年内</b><span>年内复盘</span></button>' : "");
  }
  function mobOptions() {
    const list = R.filter(r => inRange(r.id));
    return list.map(r => '<option value="' + r.id + '"' + (hxSel === r.id ? " selected" : "") + '>第' + r.id + '轮 · ' + r.name + '</option>').join("")
      + ((Y && (hxRange === "all" || hxRange === "c")) ? '<option value="yr"' + (hxSel === "yr" ? " selected" : "") + '>2026 年内 · 完整波段复盘</option>' : "");
  }

  function wire() {
    Array.prototype.forEach.call(el.querySelectorAll(".hx2-cyc .pill"), p => p.addEventListener("click", () => {
      hxSel = p.getAttribute("data-hx") === "yr" ? "yr" : Number(p.getAttribute("data-hx"));
      render();
    }));
    const mob = el.querySelector(".hx2-mobsel select");
    if (mob) mob.addEventListener("change", () => { hxSel = mob.value === "yr" ? "yr" : Number(mob.value); render(); });
    const rg = el.querySelector(".hx2-range select");
    if (rg) rg.addEventListener("change", () => {
      hxRange = rg.value;
      if (hxSel !== "yr" && !inRange(hxSel)) {
        const list = R.filter(r => inRange(r.id));
        hxSel = list.length ? list[0].id : "yr";
      }
      render();
    });
    /* 图表悬停：竖线＋圆点＋深色气泡（日期 · 点位 · 相对启动涨幅） */
    const wrap = el.querySelector(".hx2-chartwrap");
    const ov = el.querySelector("#hx2ov"), gl = el.querySelector("#hx2gl"), dot = el.querySelector("#hx2dot"), tip = el.querySelector("#hx2tip");
    const svg = wrap ? wrap.querySelector("svg") : null;
    if (wrap && ov && svg && CUR) {
      ov.addEventListener("mousemove", e => {
        const rect = svg.getBoundingClientRect();
        const scale = 1280 / rect.width;
        const vx = (e.clientX - rect.left) * scale;
        const n = CUR.year ? CUR.dates.length : CUR.S.length;
        const i = Math.max(0, Math.min(n - 1, Math.round((vx - CUR.x0) / CUR.pw * (n - 1))));
        const cx = CUR.x0 + CUR.pw * i / (n - 1);
        gl.setAttribute("x1", cx); gl.setAttribute("x2", cx); gl.setAttribute("opacity", "1");
        const val = CUR.year ? null : CUR.S[i][1];
        if (CUR.year) {
          const vals = CUR.S.map(arr => arr[i]);
          dot.setAttribute("opacity", "0");
          const mx = Math.max.apply(null, vals);
          dot.setAttribute("cx", cx); dot.setAttribute("cy", CUR.y(mx)); dot.setAttribute("opacity", "1");
          tip.innerHTML = '<div style="color:#94A3B8">' + fmtD(CUR.dates[i]) + '</div>' + CUR.names.map((nm, k) => '<div>' + nm + ' <b>' + Number(vals[k]).toFixed(1) + '</b></div>').join("");
        } else {
          dot.setAttribute("cx", cx); dot.setAttribute("cy", CUR.y(val)); dot.setAttribute("opacity", "1");
          const pct = ((val / CUR.S[0][1] - 1) * 100).toFixed(1);
          tip.innerHTML = '<div style="color:#94A3B8">' + fmtD(CUR.S[i][0]) + '</div><div><b>' + fmtP(val) + '</b> · 较启动 <b style="color:' + (pct >= 0 ? "#6EE7B7" : "#FCA5A5") + '">' + (pct >= 0 ? "+" : "") + pct + '%</b></div>';
        }
        tip.style.display = "block";
        tip.style.left = (cx / scale) + "px";
        tip.style.top = (Number(dot.getAttribute("cy")) / scale) + "px";
      });
      ov.addEventListener("mouseleave", () => { gl.setAttribute("opacity", "0"); dot.setAttribute("opacity", "0"); tip.style.display = "none"; });
    }
  }

  function render() {
    const body = (hxSel === "yr") ? (Y ? yearView() : "") : (() => { const r = R.find(x => x.id === hxSel); return r ? roundView(r) : ""; })();
    el.innerHTML = '<div class="hx2" id="hxblk">'
      + '<div class="hx2-head"><h2>历次牛市复盘</h2><span class="sub">1990/12 至今 · ' + R.length + ' 轮 · A 股上证综指口径</span>'
      + '<div class="hx2-range">时间范围 <select><option value="all"' + (hxRange === "all" ? " selected" : "") + '>至今</option><option value="a"' + (hxRange === "a" ? " selected" : "") + '>1990–2000</option><option value="b"' + (hxRange === "b" ? " selected" : "") + '>2000–2010</option><option value="c"' + (hxRange === "c" ? " selected" : "") + '>2010–至今</option></select></div></div>'
      + '<div class="hx2-cyc">' + pills() + '</div>'
      + '<div class="hx2-mobsel"><select>' + mobOptions() + '</select></div>'
      + body + '</div>';
    wire();
  }
  render();
  const chip = document.createElement("a");
  chip.href = "#hxblk"; chip.textContent = "A股历次牛市";
  document.getElementById("navChips").appendChild(chip);
})();

/* ==== 大盘总览条 v3：上证指数/科创50 近3个月日K（含成交额副图）+ 大盘量价全景合并图（上＝全A成交额三档柱：<2万亿 存量博弈 / 2-3万亿 增量博弈 / >=3万亿 风险警示；下＝上证/科创50 涨跌幅行）（MKT 数据块，fetch_market_overview.py 产出） ==== */
(function(){
/* 成交额三档：<2万亿 熊·存量博弈（绿）；2-3万亿 过渡期（金）；>=3万亿 牛·增量博弈（红） */
function tierOf(v){ return v < 20000 ? 0 : (v < 30000 ? 1 : 2); }
const TIER = [
  {name:'存量博弈', fill:'rgba(14,150,104,.72)', chip:'cold', txt:'#0a7550'},
  {name:'增量博弈',    fill:'rgba(184,134,11,.75)', chip:'gold', txt:'#7a6222'},
  {name:'风险警示',    fill:'rgba(214,52,80,.80)',  chip:'hot',  txt:'#a8243c'}
];
function fmtYi(v){ return v >= 10000 ? (v/10000).toFixed(2)+'万亿' : Math.round(v).toLocaleString('zh-CN')+'亿'; }

function kline(o){
  const D = MKT.dates, n = D.length, W = 760, H = 200, L = 8, R = 52, T = 10, PB = 126, VT = 136, VB = 190;
  const pw = W-L-R;
  const hi = Math.max.apply(null,o.H), lo = Math.min.apply(null,o.L);
  const pad = (hi-lo)*0.06 || 1;
  const vmax = Math.max.apply(null,o.V);
  const x = i => L + pw*(i+0.5)/n;
  const py = v => T + (PB-T)*(1-(v-(lo-pad))/((hi+pad)-(lo-pad)));
  const vy = v => VB - (VB-VT)*v/vmax;
  let grid = '', candles = '', volbars = '', maPts = [], ticks = '';
  [0.25,0.5,0.75].forEach(function(g){
    const gy = (T+(PB-T)*(1-g)).toFixed(1);
    grid += '<line x1="'+L+'" y1="'+gy+'" x2="'+(W-R)+'" y2="'+gy+'" stroke="#eef2f7" stroke-width="1"/>';
  });
  for (let i=0;i<n;i++){
    const up = o.C[i] >= o.O[i], col = up ? '#d63450' : '#0e9668';
    const bw = Math.max(pw/n*0.62, 2.2), cx = x(i);
    const yTop = py(Math.max(o.O[i], o.C[i])), hgt = Math.max(Math.abs(py(o.O[i])-py(o.C[i])), 1);
    candles += '<g><title>'+D[i]+'　开 '+o.O[i]+'　高 '+o.H[i]+'　低 '+o.L[i]+'　收 '+o.C[i]+'　'+o.nm+'成交 '+fmtYi(o.V[i])+'</title>'
      + '<line x1="'+cx.toFixed(1)+'" y1="'+py(o.H[i]).toFixed(1)+'" x2="'+cx.toFixed(1)+'" y2="'+py(o.L[i]).toFixed(1)+'" stroke="'+col+'" stroke-width="1"/>'
      + '<rect x="'+(cx-bw/2).toFixed(1)+'" y="'+yTop.toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+hgt.toFixed(1)+'" fill="'+col+'" rx="0.5"/></g>';
    volbars += '<rect x="'+(cx-bw/2).toFixed(1)+'" y="'+vy(o.V[i]).toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+(VB-vy(o.V[i])).toFixed(1)+'" fill="'+col+'" opacity=".5"/>';
    if (i >= 4){
      const m5 = (o.C[i-4]+o.C[i-3]+o.C[i-2]+o.C[i-1]+o.C[i])/5;
      maPts.push(cx.toFixed(1)+','+py(m5).toFixed(1));
    }
    if (i>0 && D[i].slice(5,7) !== D[i-1].slice(5,7)){
      const mx = L + pw*i/n;
      ticks += '<line x1="'+mx.toFixed(1)+'" y1="'+T+'" x2="'+mx.toFixed(1)+'" y2="'+VB+'" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="2 3"/>'
        + '<text class="mk-axis" x="'+(mx+3).toFixed(1)+'" y="'+(H-2)+'">'+D[i].slice(5,7)+'月</text>';
    }
  }
  const lastY = py(o.C[n-1]);
  const lastLine = '<line x1="'+L+'" y1="'+lastY.toFixed(1)+'" x2="'+(W-R)+'" y2="'+lastY.toFixed(1)+'" stroke="'+o.color+'" stroke-width="0.8" stroke-dasharray="4 3" opacity=".65"/>';
  const pl = (v,y,fill,w) => '<text x="'+(W-R+5)+'" y="'+(y+3).toFixed(1)+'" font-size="10" fill="'+(fill||'#98a2b3')+'"'+(w?' font-weight="700"':'')+' class="num">'+v+'</text>';
  const priceTags = pl(hi.toFixed(2), py(hi)) + pl(lo.toFixed(2), py(lo)) + pl(o.C[n-1].toFixed(2), lastY, o.color, 1);
  const maLine = '<polyline points="'+maPts.join(' ')+'" fill="none" stroke="#b8860b" stroke-width="1.4" stroke-linejoin="round" opacity=".85"/>';
  const maTag = '<text x="'+(L+4)+'" y="'+(T+9)+'" font-size="9.5" font-weight="600" fill="#b8860b">MA5</text>';
  const volPanel = '<line x1="'+L+'" y1="'+(VT-4)+'" x2="'+(W-R)+'" y2="'+(VT-4)+'" stroke="#e2e8f0" stroke-width="1"/>'
    + '<text class="mk-axis" x="'+(L+4)+'" y="'+(VT+7)+'">量·峰值 '+fmtYi(vmax)+'</text>';
  return '<svg class="mk-k" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+o.nm+' 近3个月日K线与成交额">'+grid+ticks+candles+volbars+lastLine+maLine+maTag+volPanel+priceTags+'</svg>';
}

function heatTable(){
  const d = MKT.days, n = d.length, today = MKT.asOf;
  const aAll = d.map(x=>x.amt);
  const iMaxAll = aAll.indexOf(Math.max.apply(null,aAll)), iMinAll = aAll.indexOf(Math.min.apply(null,aAll));
  const WD = ['日','一','二','三','四','五','六'];
  function band(from, to, label){
    let h = '<div class="mh-band"><div class="mh-range num">' + label + '</div><div class="mh-grid">';
    h += '<div></div>';
    for (let i=from; i<to; i++) h += '<div class="mh-dh num' + (d[i].d===today?' mh-today':'') + '"><b>' + d[i].d.slice(5).replace('-','/') + '</b><span>周' + WD[new Date(d[i].d).getDay()] + '</span></div>';
    function row(name, dot, cells){
      return '<div class="mh-lab"><i style="background:' + dot + '"></i>' + name + '</div>' + cells;
    }
    function pctCell(i, v){
      const up = v >= 0, a = (0.10 + 0.85*Math.min(Math.abs(v)/3, 1)).toFixed(2);
      const bg = up ? 'rgba(214,52,80,'+a+')' : 'rgba(14,150,104,'+a+')';
      const strong = Math.abs(v) >= 1.2;
      const nm = i>from && d[i].d.slice(5,7) !== d[i-1].d.slice(5,7);
      return '<div class="mh-cell num'+(d[i].d===today?' mh-today':'')+(nm?' mh-newmonth':'')+'" style="background:'+bg+';color:'+(strong?'#fff':(up?'#a8243c':'#0a7550'))+'" title="'+d[i].d+' 周'+WD[new Date(d[i].d).getDay()]+'　'+(v>=0?'+':'')+v+'%　两市 '+d[i].amt.toLocaleString('zh-CN')+'亿">'+(v>=0?'+':'')+v.toFixed(2)+'</div>';
    }
    let c1 = '', c2 = '';
    for (let i=from; i<to; i++){ c1 += pctCell(i, d[i].pct); c2 += pctCell(i, d[i].kcPct); }
    function volRow(){
      const SCALE = 32000;   /* 满刻度 3.2 万亿 */
      let cells = '';
      for (let i=from; i<to; i++){
        const v = d[i].amt, t = TIER[tierOf(v)];
        const isMax = i === iMaxAll, isMin = i === iMinAll;
        const bg = isMax ? '#6f42c1' : (isMin ? '#3b66d4' : t.fill);
        const tag = isMax ? '天量' : (isMin ? '地量' : '');
        const hp = Math.max(5, Math.round(v/SCALE*100));
        const nm = i>from && d[i].d.slice(5,7) !== d[i-1].d.slice(5,7);
        cells += '<div class="mh-vcell'+(d[i].d===today?' mh-vtoday':'')+(nm?' mh-newmonth':'')+'" title="'+d[i].d+' 周'+WD[new Date(d[i].d).getDay()]+'　两市 '+v.toLocaleString('zh-CN')+'亿（'+(v/10000).toFixed(2)+'万亿 · '+t.name+(isMax?' · 窗口天量':(isMin?' · 窗口地量':''))+'）"><i style="height:'+hp+'%;background:'+bg+'">'+tag+'</i></div>';
      }
      return '<div class="mh-lab"><i style="background:#b8860b"></i>全A成交额<small>0–3.2万亿 · 虚线2/3万亿</small></div>' + cells;
    }
    h += volRow() + row('上证指数', '#3b66d4', c1) + row('科创50', '#d63450', c2);
    h += '</div></div>';
    return h;
  }
  const half = Math.floor(n/2);
  const s = MKT.stat, todayTier = TIER[tierOf(s.last)];
  const chips = '<div class="mk-chips num">'
    + '<span class="mk-chip '+todayTier.chip+'">今日两市 <b>'+s.last.toLocaleString('zh-CN')+'亿 · '+todayTier.name+'</b></span>'
    + '<span class="mk-chip">5日均 <b>'+s.ma5.toLocaleString('zh-CN')+'亿</b></span>'
    + '<span class="mk-chip">3月均 <b>'+s.avg.toLocaleString('zh-CN')+'亿</b></span>'
    + '<span class="mk-chip hot">天量 <b>'+(s.max.v/10000).toFixed(2)+'万亿</b>·'+s.max.d.slice(5).replace('-','/')+'</span>'
    + '<span class="mk-chip cold">地量 <b>'+(s.min.v/10000).toFixed(2)+'万亿</b>·'+s.min.d.slice(5).replace('-','/')+'</span></div>';
  const legend = '<div class="mh-legend"><span><i style="background:rgba(214,52,80,.75)"></i>红＝上涨（深浅∝涨幅）</span><span><i style="background:rgba(14,150,104,.72)"></i>绿＝下跌（深浅∝跌幅）</span><span><i style="background:rgba(184,134,11,.72)"></i>成交量柱（三档）：绿&lt;2万亿 存量博弈｜金 2–3万亿 增量博弈｜红 ≥3万亿 风险警示</span><span><i style="background:#6f42c1"></i>紫＝天量日</span><span><i style="background:#3b66d4"></i>蓝＝地量日</span><span>横虚线＝2/3万亿档线；悬停查看精确值；金框＝当日</span></div>';
  const note = '<div class="mk-note">口径：全A成交额＝沪深两市合计（上证指数沪市＋深证综指深市日成交额），柱高满刻度 3.2 万亿；指数卡日K副图为沪市/板块成交额（红涨绿跌）。数据源：东方财富日K（push2his），快照 '+MKT.asOf+'。</div>';
  return '<div class="mkt-card mkt-heat" style="--ic:#8a6d1f">'
    + '<div class="mk-head"><span class="mk-name"><i></i>大盘量价全景 · 近 ' + n + ' 个交易日</span><span class="mk-en">VOLUME + DAILY CHANGE</span><span class="mk-asof num">' + MKT.window.from.slice(5).replace('-','/') + ' – ' + MKT.asOf.slice(5).replace('-','/') + '</span></div>'
    + chips
    + '<div style="padding-top:6px;overflow-x:auto;-webkit-overflow-scrolling:touch">'
    + band(0, half, '前段　' + d[0].d.slice(5).replace('-','/') + ' – ' + d[half-1].d.slice(5).replace('-','/') + '（第 1–' + half + ' 日）')
    + band(half, n, '近段　' + d[half].d.slice(5).replace('-','/') + ' – ' + d[n-1].d.slice(5).replace('-','/') + '（第 ' + (half+1) + '–' + n + ' 日）')
    + legend + note + '</div></div>';
}

function idxCard(o, asOfLabel){
  const cls = o.chg >= 0 ? "up" : "down";
  const sign = o.chg >= 0 ? "+" : "";
  return '<div class="mkt-card" style="--ic:'+o.color+'">'
    + '<div class="mk-head"><span class="mk-name"><i></i>'+o.nm+'</span><span class="mk-en">'+o.en+' · 近3个月日K</span><span class="mk-asof num">'+asOfLabel+'</span></div>'
    + '<div class="mk-body"><div class="mk-numcol">'
    + '<div><div class="mk-close num">'+o.close.toLocaleString("zh-CN",{minimumFractionDigits:2})+'</div>'
    + '<div class="mk-chg num '+cls+'">'+sign+o.chg.toFixed(2)+'<small>'+sign+o.pct.toFixed(2)+'%</small></div></div>'
    + '<div class="mk-meta num"><span>'+o.amtLabel+' <b>'+o.amt.toLocaleString("zh-CN")+'亿</b></span><span>3月高(盘中) <b>'+o.hi.toFixed(2)+'</b></span><span>3月低(盘中) <b>'+o.lo.toFixed(2)+'</b></span></div>'
    + '</div>' + kline(o) + '</div></div>';
}

const el = document.getElementById('mktstrip');
if (el) {
  const asOfLabel = MKT.asOf.slice(5).replace('-','/')+' 收盘';
  el.innerHTML = idxCard(MKT.idx[0], asOfLabel) + idxCard(MKT.idx[1], asOfLabel) + heatTable();
}
})();

/* ==== ETF 申赎渲染（六类 Tab 双轴图 + 重点 ETF 卡片点击联动） ==== */
(function(){
const E = (typeof ETFFLOW !== 'undefined') ? ETFFLOW : null;
const el = document.getElementById('etfflow');
if (!el || !E) { if (el) el.innerHTML = '<div class="ef-cap">ETF 申赎数据缺失（本快照未注入）</div>'; return; }
const fmt = v => (v == null ? '—' : (v >= 0 ? '+' : '') + Number(v).toFixed(1));
const cls = v => v >= 0 ? 'up' : 'down';
const TYPES = Object.keys(E.series || {}).sort();
let mode = { kind: 'type', t: TYPES[0] || '1' };   /* 主图：{kind:'type',t} | {kind:'fund',code}（宽基/策略/债基/黄金/汇金＋重点卡） */
let imode = { kind: 'type' };                       /* 行业专区图：{kind:'type'}=行业类 | {kind:'fund',code}=行业代表 */
const MAIN_TYPES = TYPES.filter(t => t !== '2');   /* 行业已独立分区，主图 Tab 不含行业 */
const INDS = E.industries || [];
const FUND_MAP = {};
E.funds.forEach(f => { FUND_MAP[f.code] = f; });
INDS.forEach(d => { FUND_MAP[d.fund.code] = d.fund; });

function miniBars(h){
  const W = 150, H = 30, n = h.length, mx = Math.max.apply(null, h.map(x => Math.abs(x[1] || 0))) || 1;
  const bw = Math.max(2, W / n - 2);
  let s = '<svg viewBox="0 0 ' + W + ' ' + H + '" style="margin-top:6px">';
  h.forEach((x, i) => {
    const v = x[1] || 0, hh = Math.max(1, Math.abs(v) / mx * (H / 2 - 2));
    s += '<rect x="' + (i * (W / n) + 1) + '" y="' + (v >= 0 ? H / 2 - hh : H / 2) + '" width="' + bw + '" height="' + hh + '" fill="' + (v >= 0 ? 'var(--red)' : 'var(--green)') + '" opacity=".8"><title>' + x[0] + ' ' + fmt(v) + '亿</title></rect>';
  });
  return s + '<line x1="0" y1="' + H / 2 + '" x2="' + W + '" y2="' + H / 2 + '" stroke="var(--border2)" stroke-width="1"/></svg>';
}

function cardHtml(f, on){
  const h = (E.history || {})[f.code] || [];
  const spark = h.filter(x => x[1] != null).length >= 3 ? miniBars(h) :
    '<div class="ef-spark-empty">每日序列积累中（自 ' + (h[0] ? h[0][0] : '—') + ' 起，历史库逐日追加）</div>';
  return '<div class="ef-card' + (on ? ' on' : '') + '" data-code="' + f.code + '"><div><span class="nm">' + f.name + '</span><span class="cd">' + f.code + '</span><span class="idx">跟踪 ' + (f.trackIdx || '—') + '</span></div>'
    + '<div class="main ' + cls(f.netIn1) + '">' + fmt(f.netIn1) + '<small>亿 最新日净流入</small></div>'
    + '<div class="sub">5日 <b>' + fmt(f.netIn5) + '</b> · 20日 <b>' + fmt(f.netIn20) + '</b> · 60日 <b>' + fmt(f.netIn60) + '</b> 亿<br>'
    + '份额5日 <b>' + (f.shareChg5 == null ? '—' : f.shareChg5 + '%') + '</b> · 最新成交 <b>' + (f.amt == null ? '—' : f.amt) + '</b> 亿</div>'
    + spark + '</div>';
}

/* 类型模式：柱=当日净流入（左轴） 线=对应指数收盘（右轴），悬停含 60 日累计 */
function typeChart(t){
  const D = E.series[t], n = D.length, W = 1360, H = 260, L = 58, R = 86, T = 14, B = 42;
  const pw = W - L - R, ph = H - T - B;
  const mx = Math.max.apply(null, D.map(r => Math.abs(r[1]))) * 1.08 || 1;
  const is = D.map(r => r[3]);
  let imn = Math.min.apply(null, is), imx = Math.max.apply(null, is);
  if (imx - imn < 1e-9) { imx += 1; imn -= 1; } else { const pad = (imx - imn) * .06; imx += pad; imn -= pad; }
  const fx = v => v >= 1000 ? v.toFixed(0) : v.toFixed(1);
  const x = i => L + pw * (i + 0.5) / n, bw = Math.max(1.6, pw / n - 1.4);
  const yv = v => T + ph * (1 - (v + mx) / (2 * mx));
  const yi = v => T + ph * (1 - (v - imn) / ((imx - imn) || 1));
  let g = '', bars = '', pts = [], labs = '';
  [-mx, -mx / 2, 0, mx / 2, mx].forEach(v => {
    g += '<line x1="' + L + '" y1="' + yv(v) + '" x2="' + (W - R) + '" y2="' + yv(v) + '" stroke="var(--border)" stroke-width="1" opacity=".55"/>'
      + '<text x="' + (L - 6) + '" y="' + (yv(v) + 3.5) + '" text-anchor="end" font-size="10" fill="var(--faint)">' + v.toFixed(0) + '</text>';
  });
  D.forEach((r, i) => {
    const up = r[1] >= 0, hh = Math.max(1, Math.abs(r[1]) / mx * ph / 2);
    bars += '<rect x="' + (x(i) - bw / 2) + '" y="' + (up ? yv(r[1]) : yv(0)) + '" width="' + bw + '" height="' + hh + '" fill="' + (up ? 'var(--red)' : 'var(--green)') + '" opacity=".8"><title>' + r[0] + ' 净流入 ' + fmt(r[1]) + '亿 · 60日累计 ' + fmt(r[2]) + '亿 · 对应指数收盘 ' + r[3] + '</title></rect>';
    pts.push(x(i).toFixed(1) + ',' + yi(r[3]).toFixed(1));
    if (i % Math.ceil(n / 9) === 0 || i === n - 1)
      labs += '<text x="' + x(i) + '" y="' + (H - 16) + '" text-anchor="middle" font-size="10" fill="var(--faint)">' + r[0].slice(5) + '</text>';
  });
  [imx, (imx + imn) / 2, imn].forEach(v => {
    g += '<text x="' + (W - R + 10) + '" y="' + (yi(v) + 3.5) + '" font-size="10" fill="#3b66d4" style="paint-order:stroke" stroke="#fff" stroke-width="3">' + fx(v) + '</text>';
  });
  return '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img">' + g + bars
    + '<polyline points="' + pts.join(' ') + '" fill="none" stroke="#3b66d4" stroke-width="1.8"/>' + labs
    + '<text x="' + (W - R + 10) + '" y="' + (T + 4) + '" font-size="10" fill="#3b66d4" style="paint-order:stroke" stroke="#fff" stroke-width="3">指数</text></svg>';
}

/* 单只模式：按天净流入柱（本地库逐日积累）+ ETF 收盘价线（右轴，可回溯） */
function fundChart(f, withSum){
  const K = f.k || [], hist = ((E.history || {})[f.code] || []).filter(x => x[1] != null);
  const nmap = {}; hist.forEach(x => { nmap[x[0]] = x[1]; });
  const W = 1360, H = 260, L = 58, R = 80, T = 14, B = 42, n = K.length || 1;
  const pw = W - L - R, ph = H - T - B;
  const mx = Math.max(20, Math.max.apply(null, hist.map(x => Math.abs(x[1])).concat([Math.abs(f.netIn1 || 0)])) * 1.15);
  const cs = K.map(x => x[1]);
  let cmn = cs.length ? Math.min.apply(null, cs) : 0, cmx = cs.length ? Math.max.apply(null, cs) : 1;
  if (cmx - cmn < 1e-9) { cmx += 1; cmn -= 1; } else { const pad = (cmx - cmn) * .06; cmx += pad; cmn -= pad; }
  const fxp = v => v >= 100 ? v.toFixed(1) : v.toFixed(3);
  const x = i => L + pw * (i + 0.5) / n, bw = Math.max(1.8, Math.min(26, pw / n - 1.2));
  const yv = v => T + ph * (1 - (v + mx) / (2 * mx));
  const yc = v => T + ph * (1 - (v - cmn) / ((cmx - cmn) || 1));
  let g = '', bars = '', pts = [], labs = '';
  [-mx, -mx / 2, 0, mx / 2, mx].forEach(v => {
    g += '<line x1="' + L + '" y1="' + yv(v) + '" x2="' + (W - R) + '" y2="' + yv(v) + '" stroke="var(--border)" stroke-width="1" opacity=".55"/>'
      + '<text x="' + (L - 6) + '" y="' + (yv(v) + 3.5) + '" text-anchor="end" font-size="10" fill="var(--faint)">' + v.toFixed(0) + '</text>';
  });
  K.forEach((r, i) => {
    const d = r[0], v = nmap[d];
    if (v != null) {
      const up = v >= 0, hh = Math.max(1.5, Math.abs(v) / mx * ph / 2);
      bars += '<rect x="' + (x(i) - bw / 2) + '" y="' + (up ? yv(v) : yv(0)) + '" width="' + bw + '" height="' + hh + '" fill="' + (up ? 'var(--red)' : 'var(--green)') + '"><title>' + d + ' 净流入 ' + fmt(v) + '亿</title></rect>';
    }
    pts.push(x(i).toFixed(1) + ',' + yc(r[1]).toFixed(1));
    if (i % Math.ceil(n / 9) === 0 || i === n - 1)
      labs += '<text x="' + x(i) + '" y="' + (H - 16) + '" text-anchor="middle" font-size="10" fill="var(--faint)">' + d.slice(5) + '</text>';
  });
  [cmx, (cmx + cmn) / 2, cmn].forEach(v => {
    g += '<text x="' + (W - R + 10) + '" y="' + (yc(v) + 3.5) + '" font-size="10" fill="#3b66d4" style="paint-order:stroke" stroke="#fff" stroke-width="3">' + fxp(v) + '</text>';
  });
  return '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img">' + g + bars
    + '<polyline points="' + pts.join(' ') + '" fill="none" stroke="#3b66d4" stroke-width="1.8"/>' + labs
    + '<text x="' + (W - R + 10) + '" y="' + (T + 4) + '" font-size="10" fill="#3b66d4" style="paint-order:stroke" stroke="#fff" stroke-width="3">价格</text></svg>'
    + (withSum === false ? '' : '<div class="ef-sum" style="margin:8px 0 2px"><span>净流入 近1日 <b class="' + cls(f.netIn1) + '">' + fmt(f.netIn1) + '</b></span>'
    + '<span>近5日 <b class="' + cls(f.netIn5) + '">' + fmt(f.netIn5) + '</b></span>'
    + '<span>近20日 <b class="' + cls(f.netIn20) + '">' + fmt(f.netIn20) + '</b></span>'
    + '<span>近60日 <b class="' + cls(f.netIn60) + '">' + fmt(f.netIn60) + ' 亿</b></span>'
    + '<span>份额5日 <b class="' + cls(f.shareChg5) + '">' + (f.shareChg5 == null ? '—' : f.shareChg5 + '%') + '</b></span>'
    + '<span>份额20日 <b class="' + cls(f.shareChg20) + '">' + (f.shareChg20 == null ? '—' : f.shareChg20 + '%') + '</b></span>'
    + '<span>最新成交 <b>' + (f.amt == null ? '—' : f.amt) + ' 亿</b></span></div>')
    + '<div class="ef-axis-note">柱=该 ETF 当日净流入（亿元，红入绿出；自 ' + (hist[0] ? hist[0][0] : '—') + ' 起由本地历史库逐日积累，单只历史无官方回溯接口' + (hist.length < 3 ? '，序列积累中' : '') + '） · 蓝线=ETF 收盘价（右轴，前复权，东财日 K）</div>';
}

/* 行业专区：左侧聚合下拉列表（类内按规模倒序、近5日净流入倒序，区域内滑动）＋右侧图表 */
function indItem(d){
  const f = d.fund;
  const tip = d.cat + ' · ' + d.idx + (d.gidx && d.gidx !== d.idx ? '（跟踪指数：' + d.gidx + '）' : '') + ' · 代表 ' + f.name + '\n规模 ' + (f.scale || '—') + ' 亿 · 当日 ' + fmt(f.netIn1) + ' · 5日 ' + fmt(f.netIn5) + ' 亿\n组内前三：\n'
    + d.top.map((x, i) => (i + 1) + '. ' + x.name + ' ' + x.code + ' 规模 ' + (x.scale || '—') + ' 亿').join('\n');
  const col = ({'科技':'#3b66d4','医药':'#0e9f9f','消费':'#8b5cf6','金融':'#d97706','有色':'#64748b'})[d.cat] || '#3b66d4';
  const on = imode.kind === 'fund' && imode.code === f.code;
  return '<div class="ef-isitem' + (on ? ' on' : '') + '" data-code="' + f.code + '" title="' + tip.replace(/"/g, '&quot;') + '"' + (on ? ' style="border-left-color:' + col + '"' : '') + '>'
    + '<div class="nm"><b>' + d.idx + '</b><span class="cd">' + f.code + '</span></div>'
    + '<div class="v1">' + (f.scale || '—') + '<i>亿</i></div>'
    + '<div class="v2 ' + cls(f.netIn5) + '">' + fmt(f.netIn5) + '</div>'
    + '<i class="ef-isarrow">▸</i></div>';
}

function indSelHtml(){
  const CC = {'科技':'#3b66d4','医药':'#0e9f9f','消费':'#8b5cf6','金融':'#d97706','有色':'#64748b'};
  const N5 = v => (v == null ? -1e18 : v);
  let h = '<div class="ef-isitem ef-isall' + (imode.kind !== 'fund' ? ' on' : '') + '" data-code="__all__" title="行业类 ETF 整体净流入（全部行业，含未入榜行业）" style="border-bottom:1px solid var(--border)">'
    + '<div class="nm"><b>行业整体</b><span class="cd">全景</span></div><i class="ef-isarrow">▸</i></div>';
  Object.keys(CC).filter(c => INDS.some(d => d.cat === c)).forEach(c => {
    const list = INDS.filter(d => d.cat === c)
      .sort((a, b) => (b.fund.scale - a.fund.scale) || (N5(b.fund.netIn5) - N5(a.fund.netIn5)));
    const sumSc = list.reduce((a, d) => a + (d.fund.scale || 0), 0);
    const sumIn = list.reduce((a, d) => a + (d.fund.netIn5 || 0), 0);
    h += '<div class="ef-iscat" style="border-left-color:' + CC[c] + ';background:' + CC[c] + '0F" title="' + c + ' · ' + list.length + ' 行业 · 规模合计 ' + sumSc.toFixed(1) + ' 亿 · 5日净流入合计 ' + fmt(sumIn) + ' 亿"><b style="color:' + CC[c] + '">' + c + '</b><span class="cnt">' + list.length + '</span></div>'
      + list.map(indItem).join('');
  });
  return '<div class="ef-indsel">' + h + '</div>';
}

function render(){
  const cards = E.funds.map(f => cardHtml(f, mode.kind === 'fund' && mode.code === f.code)).join('');
  /* 主图：宽基/策略/债基/黄金/汇金 Tab ＋ 重点卡联动（独立于行业专区） */
  let chartHtml;
  if (mode.kind === 'fund') {
    const f = FUND_MAP[mode.code] || E.funds[0];
    chartHtml = '<h4>' + f.name + '（' + f.code + '）净买入趋势 <span class="ef-back" data-back="1">✕ 返回分类视图</span></h4>'
      + fundChart(f);
  } else {
    const mt = MAIN_TYPES.indexOf(mode.t) >= 0 ? mode.t : MAIN_TYPES[0];
    const tabs = MAIN_TYPES.map(t => '<span class="ef-tab' + (t === mt ? ' on' : '') + '" data-t="' + t + '">' + (E.types[t] || t) + '</span>').join('');
    const last = E.series[mt].slice(-1)[0];
    chartHtml = '<h4>历史 ETF 申购净流入 · ' + (E.types[mt] || mt) + '（近 ' + E.series[mt].length + ' 个交易日）</h4>'
      + '<div class="ef-tabs">' + tabs + '</div>'
      + '<div class="ef-sum"><span>昨日净流入 <b class="' + cls(last[1]) + '">' + fmt(last[1]) + ' 亿</b></span>'
      + '<span>近60日净流入 <b class="' + cls(last[2]) + '">' + fmt(last[2]) + ' 亿</b></span>'
      + '<span>对应指数收盘 <b>' + last[3] + '</b></span></div>'
      + typeChart(mt)
      + '<div class="ef-axis-note">柱=当日估算净流入（左轴，亿元，红入绿出） · 线=对应指数收盘（右轴） · 悬停柱体可见当日明细（含 60 日累计） · 点击上方重点卡切换单只 ETF 净买入趋势</div>';
  }
  /* 行业专区图：行业类整体 ＋ 行业代表卡联动（独立于主图） */
  let indChartHtml;
  if (imode.kind === 'fund') {
    const f = FUND_MAP[imode.code] || INDS[0].fund;
    const kt = INDS.filter(d => d.fund.code === imode.code)[0];
    const icol = kt ? (({'科技':'#3b66d4','医药':'#0e9f9f','消费':'#8b5cf6','金融':'#d97706','有色':'#64748b'})[kt.cat] || '#3b66d4') : '#3b66d4';
    indChartHtml = '<h4><i class="ef-hdot" style="background:' + icol + '"></i>' + f.name + '（' + f.code + '）净买入趋势' + (kt ? ' <span class="ef-ktag">' + kt.idx + (kt.gidx && kt.gidx !== kt.idx ? ' · ' + kt.gidx : '') + '</span>' : '') + ' <span class="ef-back" data-iback="1">✕ 返回行业视图</span></h4>'
      + '<div class="ef-sum" style="margin:0 0 8px"><span>净流入 1日 <b class="' + cls(f.netIn1) + '">' + fmt(f.netIn1) + '</b></span><span>5日 <b class="' + cls(f.netIn5) + '">' + fmt(f.netIn5) + '</b></span><span>20日 <b class="' + cls(f.netIn20) + '">' + fmt(f.netIn20) + '</b></span><span>60日 <b class="' + cls(f.netIn60) + '">' + fmt(f.netIn60) + ' 亿</b></span><span>规模 <b>' + (f.scale || '—') + ' 亿</b></span><span>成交 <b>' + (f.amt == null ? '—' : f.amt) + ' 亿</b></span></div>'
      + fundChart(f, false);
  } else {
    const last = E.series['2'].slice(-1)[0];
    indChartHtml = '<h4><i class="ef-hdot" style="background:#8a94a6"></i>历史 ETF 申购净流入 · 行业（近 ' + E.series['2'].length + ' 个交易日）</h4>'
      + '<div class="ef-sum"><span>昨日净流入 <b class="' + cls(last[1]) + '">' + fmt(last[1]) + ' 亿</b></span>'
      + '<span>近60日净流入 <b class="' + cls(last[2]) + '">' + fmt(last[2]) + ' 亿</b></span>'
      + '<span>对应指数收盘 <b>' + last[3] + '</b></span></div>'
      + typeChart('2')
      + '<div class="ef-axis-note">柱=当日估算净流入（左轴，亿元，红入绿出） · 线=对应指数收盘（右轴） · 悬停柱体可见当日明细（含 60 日累计） · 左侧列表点选行业切换单只净买入趋势</div>';
  }
  const indSec = INDS.length ? '<div class="ef-isec">'
    + '<div class="ef-khead">行业 ETF 观察池 · 分组代表 · 资金偏好</div>'
    + '<div class="ef-knote">观察清单固定 14 行业：科技（半导体/机器人/商业航天/人工智能）、医药（创新药）、消费（800消费/酒/传媒/畜牧/游戏）、金融（银行/非银/证券）、有色——每行业按关键词匹配跟踪指数、组内取规模最大的 ETF 作代表（悬停可见实际跟踪指数与组内前三）；左侧分组按 科技→医药→消费→金融→有色、类内按规模倒序＋近 5 日净流入倒序，区域内可滑动；点选行业右侧查看净买入趋势（默认“行业整体”）</div>'
    + '<div class="ef-indlay">' + indSelHtml() + '<div class="ef-chart ef-indchart">' + indChartHtml + '</div></div></div>' : '';
  el.innerHTML = '<div class="ef-head"><span class="ef-title">ETF 申赎与资金流</span>'
    + '<span class="ef-cap">数据截至 ' + E.asOf + '（T-1 交易日，当日盘后发布） · 口径=估算净流入（份额变动×净值） · 重点跟踪 ' + E.funds.map(f => f.code).join(' / ') + '（点击卡片看净买入趋势）</span></div>'
    + '<div class="ef-grid">' + cards + '</div>'
    + '<div class="ef-chart">' + chartHtml + '</div>'
    + indSec
  Array.prototype.forEach.call(el.querySelectorAll('.ef-card'), c => c.addEventListener('click', () => {
    const code = c.getAttribute('data-code');
    mode = (mode.kind === 'fund' && mode.code === code) ? { kind: 'type', t: mode.t || TYPES[0] } : { kind: 'fund', code: code };
    render();
  }));
  Array.prototype.forEach.call(el.querySelectorAll('.ef-isitem'), it => it.addEventListener('click', () => {
    const code = it.getAttribute('data-code');
    imode = (code === '__all__') ? { kind: 'type' } : { kind: 'fund', code: code };
    render();
  }));
  Array.prototype.forEach.call(el.querySelectorAll('.ef-tab'), t => t.addEventListener('click', () => {
    mode = { kind: 'type', t: t.getAttribute('data-t') };
    render();
  }));
  const back = el.querySelector('[data-back]');
  if (back) back.addEventListener('click', () => { mode = { kind: 'type', t: mode.t || TYPES[0] }; render(); });
  const iback = el.querySelector('[data-iback]');
  if (iback) iback.addEventListener('click', () => { imode = { kind: 'type' }; render(); });
  const selOn = el.querySelector('.ef-indsel .ef-isitem.on');
  if (selOn) selOn.scrollIntoView({ block: 'nearest' });

}
render();
})();
</script>
</body>
